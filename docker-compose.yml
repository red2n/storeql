# StoreQL — local development stack.
#
# Startup is health-check driven: each layer waits for the previous to be ready.
# Infra → Platform (config/consul) → Business services (parallel) → Gateway
#
# All services share `storeql_network`; inter-container addressing is by service
# name on port 8080 (e.g. http://iam-svc:8080).
#
# Usage:
#   cp .env.example .env && nano .env   # set real secrets
#   mvn clean install -DskipTests       # build all JARs (JDK 21)
#   docker compose up -d --build        # build images + start everything
#
# Ports exposed to the host (developers need these):
#   8088  storeql-app (web UI: admin/storefront/POS)
#   8090  gateway (public entry point)    3100  grafana
#   5555  pgadmin                         8500  consul UI
#   8081  kafka-ui                        9411  zipkin
#   8082  swagger-ui (API docs)           9090  prometheus
#   5432  postgres (direct SQL access)    6379  redis (redis-cli)
#   4317  otel-collector (OTLP/gRPC — lets a service run outside docker, against the
#         dockerized stack, still ship traces+logs)
#   8095  mock-idp (a stand-in OpenID Connect provider for single sign-on; see its service)
#
# Every service exports telemetry via OTLP only (traces + logs); there is no separate
# log-scraping pipeline. Ports intentionally NOT exposed (internal only — use Grafana):
#   loki (3100), tempo (3200), node/postgres/redis exporters (9100/9187/9121),
#   pgbouncer (6432), config-svc (8080)

name: storeql

networks:
  storeql_network:
    name: storeql_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # ip_range scopes Docker's *dynamic* allocator to .128-.255, leaving .2-.127
          # untouched by auto-assignment. postgres needs a pinned, never-stolen IP (see
          # x-postgres-ip below); without this, any other container that starts first and
          # doesn't request a specific IP could be auto-assigned .10, and postgres then
          # fails to start at all with "Address already in use" — taking pgbouncer, config,
          # every business service, and the gateway down with it.
          # NOTE: aux_addresses looks like the obvious tool here but is wrong — it blocks an
          # address from *all* assignment, including the explicit ipv4_address request below,
          # so postgres itself could never start. ip_range is the supported way to carve out
          # a static-only range while leaving the rest of the subnet free for auto-assignment.
          ip_range: 172.28.0.128/25

# postgres is pinned to this address (see postgres.networks below) so pgbouncer can
# reach it via extra_hosts, bypassing pgbouncer's c-ares resolver — which fails to
# parse Docker's generated /etc/resolv.conf (search "." + edns0/ndots options) and
# throws "server DNS lookup failed (bad-af)" on the plain "postgres" hostname even
# though every other client (JVM/libc resolvers) resolves it fine.
x-postgres-ip: &postgres-ip 172.28.0.10

# ── Named volumes ────────────────────────────────────────────────────────────
# The broker's one password user (20.15): the publisher, from the environment — never a file in
# the repository. CSV as EMQX's built-in database bootstrap expects it.
configs:
  mqtt_auth_bootstrap:
    content: |
      user_id,password,is_superuser
      __publisher__,${MQTT_PUBLISHER_PASSWORD:?MQTT_PUBLISHER_PASSWORD must be set - see .env.example},false

volumes:
  pgdata:
  # Dumps, base backups and archived WAL (docs/BACKUP-AND-RESTORE.md). Bind it to a disk of its own
  # in production (a backup on the database's disk is not a backup): see docker-compose.prod.yml.
  backups:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
  loki_data:
  tempo_data:

# ── YAML anchors — shared blocks to avoid repeating 8 env vars per service ──
x-svc-env: &svc-env
  server.port: "8080"
  # Application log level, applied to com.storeql at startup by LogLevelConfigurer. INFO keeps
  # steady-state volume sane — every record here is formatted, shipped over OTLP and stored, so
  # FINE across 14 services is paid for three times. Set STOREQL_LOG_LEVEL=FINE (or DEBUG) in .env
  # while debugging; it needs no rebuild, only a restart of the affected service.
  STOREQL_LOG_LEVEL: ${STOREQL_LOG_LEVEL:-INFO}
  # Runtime app pool goes through PgBouncer (golden rule: don't orphan provisioned infra).
  # Flyway gets its own direct-to-Postgres URL below — its DDL migrations run as multi-statement
  # transactions that need full session affinity, which PgBouncer's transaction pool_mode breaks.
  storeql.db.url: jdbc:postgresql://pgbouncer:6432/${POSTGRES_DB:-storeql}?prepareThreshold=0
  storeql.db.migration-url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-storeql}
  storeql.db.user: ${POSTGRES_USER:-storeql}
  storeql.db.password: ${POSTGRES_PASSWORD:-storeql_dev_change_me}
  storeql.consul.host: consul
  storeql.consul.port: "8500"
  storeql.kafka.bootstrap: kafka:29092
  # Central config: each service pulls non-secret overrides from config-svc at startup and layers
  # them over its baked defaults (falls back to local defaults if config-svc is unreachable).
  storeql.config.url: http://config:8080
  storeql.config.profile: docker
  storeql.config.token: ${STOREQL_CONFIG_TOKEN:?STOREQL_CONFIG_TOKEN must be set (>= 32 chars) - see .env.example}
  # OTLP is the only telemetry path — traces AND logs, to the collector (no Promtail/Zipkin-direct).
  otel.exporter.otlp.endpoint: http://otel-collector:4317

x-svc-depends: &svc-depends
  postgres:  { condition: service_healthy }
  pgbouncer: { condition: service_healthy }
  kafka:     { condition: service_healthy }
  consul:    { condition: service_healthy }
  config:    { condition: service_healthy }

x-svc-healthcheck: &svc-healthcheck
# eclipse-temurin:21-jre ships curl but not wget.
  test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/health/live || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  # ---------------------------------------------------------------- infrastructure

  # PostgreSQL tuned for multi-tenant workload.
  # Defaults sized for a 4–8 GB dev host; override via .env (PG_SHARED_BUFFERS, etc.).
  postgres:
    image: postgres:16-alpine
    container_name: storeql-postgres
    restart: unless-stopped
    # The image's entrypoint, wrapped for three things the backup job needs (the rehearsed
    # backup-restore drill): the backups volume's directories owned by postgres (a named volume is
    # born root's), the replication line in pg_hba.conf so pg_basebackup may connect from the backup
    # container (an existing volume; a fresh one gets it from infra/postgres-init-hba.sh), and WAL
    # archiving into that volume so a restore can be taken to a moment. archive_timeout bounds the
    # data at risk: a segment is closed and archived at least every PG_ARCHIVE_TIMEOUT seconds.
    command:
      - sh
      - -c
      - |
        mkdir -p /backups/wal /backups/dumps /backups/base /backups/metrics && chown -R postgres:postgres /backups
        HBA="$${PGDATA:-/var/lib/postgresql/data}/pg_hba.conf"
        if [ -f "$$HBA" ] && ! grep -q storeql-backup "$$HBA"; then
          printf 'host replication all all scram-sha-256 # storeql-backup: base backups for point-in-time recovery\n' >> "$$HBA"
        fi
        exec docker-entrypoint.sh postgres \
          -c shared_buffers=${PG_SHARED_BUFFERS:-512MB} \
          -c work_mem=${PG_WORK_MEM:-16MB} \
          -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB} \
          -c wal_buffers=${PG_WAL_BUFFERS:-16MB} \
          -c max_wal_size=${PG_MAX_WAL_SIZE:-1GB} \
          -c min_wal_size=${PG_MIN_WAL_SIZE:-128MB} \
          -c checkpoint_completion_target=0.9 \
          -c synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-off} \
          -c random_page_cost=${PG_RANDOM_PAGE_COST:-1.1} \
          -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB} \
          -c max_connections=${PG_MAX_CONNECTIONS:-300} \
          -c autovacuum_max_workers=${PG_AUTOVACUUM_MAX_WORKERS:-3} \
          -c autovacuum_vacuum_scale_factor=${PG_AUTOVACUUM_VACUUM_SCALE:-0.05} \
          -c autovacuum_analyze_scale_factor=${PG_AUTOVACUUM_ANALYZE_SCALE:-0.025} \
          -c autovacuum_vacuum_cost_delay=${PG_AUTOVACUUM_COST_DELAY:-2ms} \
          -c default_statistics_target=200 \
          -c shared_preload_libraries=pg_stat_statements \
          -c pg_stat_statements.track=all \
          -c log_min_duration_statement=${PG_LOG_MIN_DURATION:-200} \
          -c archive_mode=on \
          -c "archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/%f" \
          -c archive_timeout=${PG_ARCHIVE_TIMEOUT:-300}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storeql}
      POSTGRES_USER: ${POSTGRES_USER:-storeql}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storeql_dev_change_me}
    # Host publish is for local tooling only — services reach Postgres at postgres:5432 (Flyway)
    # and pgbouncer:6432 (runtime) on the compose network. Configurable because another Compose
    # project on this machine binds 0.0.0.0:5432, which blocks even a loopback bind here.
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Per-service roles + GRANTs (golden rule #1 hardening). Only runs on a fresh
      # volume; against an existing one, re-apply manually — see header comment in
      # the script for the exact `docker compose exec` invocation.
      - ./infra/postgres-init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      # A fresh volume also gets the replication line the backup job's base backups need.
      - ./infra/postgres-init-hba.sh:/docker-entrypoint-initdb.d/02-replication-hba.sh:ro
      # Where the dumps, base backups and archived WAL live; shared with the backup job.
      - backups:/backups
    networks:
      storeql_network:
        ipv4_address: *postgres-ip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storeql}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # storeql-backup — the stack's Postgres backed up on a schedule (the rehearsed backup-restore
  # drill): a pg_dump from one snapshot every day at STOREQL_BACKUP_AT (UTC) with a manifest of every
  # table's count, encrypted to STOREQL_BACKUP_RECIPIENT (an age public key; without one the backup
  # is plain and the log says so), a base backup every STOREQL_BACKUP_BASE_EVERY_DAYS for
  # point-in-time recovery over the WAL Postgres archives above, the newest STOREQL_BACKUP_KEEP kept.
  # `docker compose run --rm backup now` takes one now; scripts/backup-drill.sh restores one, and to
  # a moment, and proves both — see docs/BACKUP-AND-RESTORE.md.
  backup:
    image: ghcr.io/red2n/storeql-backup:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    container_name: storeql-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-storeql}
      PGPASSWORD: ${POSTGRES_PASSWORD:-storeql_dev_change_me}
      PGDATABASE: ${POSTGRES_DB:-storeql}
      STOREQL_BACKUP_AT: ${STOREQL_BACKUP_AT:-02:30}
      STOREQL_BACKUP_KEEP: ${STOREQL_BACKUP_KEEP:-14}
      STOREQL_BACKUP_KEEP_BASE: ${STOREQL_BACKUP_KEEP_BASE:-4}
      STOREQL_BACKUP_BASE_EVERY_DAYS: ${STOREQL_BACKUP_BASE_EVERY_DAYS:-7}
      STOREQL_BACKUP_RECIPIENT: ${STOREQL_BACKUP_RECIPIENT:-}
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [storeql_network]

  # PgBouncer — connection pooler (transaction mode, 2000 app → 150 real connections).
  # Business services route their runtime pool through pgbouncer:6432 (storeql.db.url, set in
  # x-svc-env above). Flyway uses its own storeql.db.migration-url straight to postgres:5432 —
  # its DDL migrations are multi-statement transactions that need full session affinity, which
  # this pooler's transaction pool_mode does not guarantee mid-migration.
  # NOTE: auth_type=trust is fine for local dev (no external access). Change to
  # scram-sha-256 for any shared or internet-facing deployment.
  pgbouncer:
    # pgbouncer/pgbouncer does not publish consistent versioned tags beyond 1.15.0;
    # latest is the only way to get a current release from this image.
    image: pgbouncer/pgbouncer:latest
    container_name: storeql-pgbouncer
    restart: unless-stopped
    environment:
      # Raw DATABASES entry with no fixed user/password: each connecting service
      # authenticates as its own per-service role (infra/postgres-init-roles.sql), and
      # that same identity is what PgBouncer uses against the real Postgres backend —
      # via the credential stored for it in userlist.txt. A fixed DATABASES_USER would
      # collapse every connection back to one shared identity and defeat the
      # per-service GRANTs.
      DATABASES: "* = host=postgres port=5432 dbname=${POSTGRES_DB:-storeql}"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "2000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "50"
      # min_pool_size is a per-service-role idle reservation, paid out of max_db_connections
      # whether or not that service is busy. At 10 × ~12 service roles it was eating ~120 of
      # the 150 connection budget just sitting idle, leaving ~30 of real headroom for actual
      # concurrent load — observed under k6 (SHOW POOLS: 121 idle / 150 max during a run) as
      # widespread, scattered timeouts across nearly every service. Lowering the per-role
      # reservation and raising the ceiling (still well under postgres's max_connections=300,
      # which also serves Flyway's direct migration connections + pgadmin + exporters) trades
      # idle-connection readiness for burst headroom.
      PGBOUNCER_MIN_POOL_SIZE: "4"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_MAX_DB_CONNECTIONS: "220"
      PGBOUNCER_SERVER_LIFETIME: "3600"
      PGBOUNCER_SERVER_IDLE_TIMEOUT: "300"
      PGBOUNCER_QUERY_TIMEOUT: "30"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: "extra_float_digits,options"
      PGBOUNCER_AUTH_TYPE: trust
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
    # infra/pgbouncer-userlist.txt holds one "username" "password" line per role
    # (bootstrap + all 12 per-service roles), kept in sync by hand with
    # infra/postgres-init-roles.sql and the <SERVICE>_DB_PASSWORD vars above/below.
    # IMPORTANT: this pgbouncer build's userlist.txt parser rejects ANY "#" comment
    # line outright (logs "ERROR broken auth file" and silently drops every user) —
    # do not add comments to that file; put notes here instead.
    volumes:
      - ./infra/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    # Bypasses pgbouncer's broken c-ares DNS resolution of "postgres" (see x-postgres-ip
    # comment above) — written straight to /etc/hosts, no resolver involved.
    extra_hosts:
      postgres: *postgres-ip
    depends_on:
      postgres: { condition: service_healthy }
    networks: [storeql_network]
    healthcheck:
      # 127.0.0.1, not localhost: pgbouncer listens on IPv4 only, and busybox nc in the current image
      # resolves localhost to ::1 first, so "nc -z localhost" failed and held every service back.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:1.22.0
    container_name: storeql-consul
    restart: unless-stopped
    command: agent -dev -client=0.0.0.0
    ports: ["127.0.0.1:8500:8500"]
    networks: [storeql_network]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Kafka in KRaft mode (no Zookeeper — Kafka 3.6+).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: storeql-kafka
    restart: unless-stopped
    # Host publish is for local tooling only — every service reaches Kafka at kafka:29092 on the
    # compose network, so changing this cannot affect the stack. Configurable because another
    # Compose project on the same machine binding 0.0.0.0:9092 makes even a loopback bind here fail,
    # which has taken this stack down once already.
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 0WL1kI1NQdi0DVeRDFPA4g
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms512m -Xmx1g}"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ExplicitGCInvokesConcurrent"
    volumes: ["kafka_data:/var/lib/kafka/data"]
    mem_limit: ${KAFKA_MEM_LIMIT:-1300m}
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  # Kafka UI — browse topics, consumer groups, and messages.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: storeql-kafka-ui
    restart: unless-stopped
    ports: ["127.0.0.1:${KAFKA_UI_PORT:-8081}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: storeql-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "${KAFKA_UI_JAVA_OPTS:--Xms128m -Xmx384m}"
    mem_limit: ${KAFKA_UI_MEM_LIMIT:-550m}
    depends_on:
      kafka: { condition: service_healthy }
    networks: [storeql_network]

  # Swagger UI — browses every business service's MicroProfile OpenAPI contract (served at
  # /api/<service>/openapi through the gateway; that path is whitelisted as public in
  # JwtAuthFilter so the browser can fetch the spec without a token). One container, a
  # dropdown per service — nothing to add here when a new service joins; just append it to
  # routableServices in GatewayConfig and to this URLS list.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: storeql-swagger-ui
    restart: unless-stopped
    ports: ["127.0.0.1:${SWAGGER_UI_PORT:-8082}:8080"]
    environment:
      URLS: >-
        [{"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/iam-svc/openapi", "name": "iam-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/tenant-svc/openapi", "name": "tenant-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/product-svc/openapi", "name": "product-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/inventory-svc/openapi", "name": "inventory-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/pricing-svc/openapi", "name": "pricing-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/cart-svc/openapi", "name": "cart-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/order-svc/openapi", "name": "order-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/payment-svc/openapi", "name": "payment-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/purchase-svc/openapi", "name": "purchase-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/customer-svc/openapi", "name": "customer-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/notification-svc/openapi", "name": "notification-svc"},
        {"url": "http://localhost:${GATEWAY_HOST_PORT:-8090}/api/v1/reporting-svc/openapi", "name": "reporting-svc"}]
      URLS_PRIMARY_NAME: iam-svc
    mem_limit: ${SWAGGER_UI_MEM_LIMIT:-256m}
    networks: [storeql_network]
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget in this image resolves localhost to ::1 first,
      # and nginx here only binds the IPv4 wildcard, so that would always fail with "connection
      # refused" even though the service is up.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storeql-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_change_me}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    networks: [storeql_network]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # A stand-in identity provider for single sign-on (20.x): a real OpenID Connect server
  # (navikt/mock-oauth2-server), not one of ours, so what is driven against it is the protocol and
  # not our own reading of it. Connect a business to issuer http://mock-idp:8080/storeql with any
  # client id and secret; its sign-in page takes any name, and a JSON box of claims to put in the
  # ID token (email, email_verified, amr).
  #
  # iam-svc reaches it as mock-idp; a browser on this machine reaches it on 8095. The discovery
  # document names mock-idp, so for a browser walkthrough add "127.0.0.1 mock-idp" to the hosts
  # file; k6/sso-flow.js rewrites the address instead. Never deployed: k8s has no such thing, and
  # storeql.sso.insecure-hosts, which lets iam-svc call it over plain HTTP, is empty there.
  mock-idp:
    image: ghcr.io/navikt/mock-oauth2-server:2.2.1
    container_name: storeql-mock-idp
    restart: unless-stopped
    ports: ["127.0.0.1:${MOCK_IDP_PORT:-8095}:8080"]
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: '{"interactiveLogin": true}'
      JAVA_TOOL_OPTIONS: "${MOCK_IDP_JAVA_OPTS:--Xms32m -Xmx128m}"
    mem_limit: ${MOCK_IDP_MEM_LIMIT:-256m}
    networks: [storeql_network]

  # A receiver for the webhooks k6 drives (22.6): answers every request with what it received —
  # method, headers, body — so the delivery log, which keeps the first kilobytes of an answer, shows
  # the signature and the body as they arrived and a test can verify them. notification-svc reaches
  # it as webhook-sink over plain HTTP (storeql.webhooks.insecure-hosts); it opens no host port and
  # is never deployed.
  # A mail catcher for the dev stack (password reset): notification-svc sends real email to it over
  # SMTP, a person reads it at http://localhost:8025 and k6/password-reset-flow.js reads it through
  # its API to follow the link as a person would. Never deployed: an operator points
  # storeql.notification.smtp.* at their own mail service.
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: storeql-mailpit
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"]
    environment:
      MP_MAX_MESSAGES: "5000"
    mem_limit: ${MAILPIT_MEM_LIMIT:-128m}
    networks: [storeql_network]

  webhook-sink:
    image: mendhak/http-https-echo:37
    container_name: storeql-webhook-sink
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
      DISABLE_REQUEST_LOGS: "true"
    mem_limit: ${WEBHOOK_SINK_MEM_LIMIT:-128m}
    networks: [storeql_network]

  # MQTT broker for notification-svc's device-facing push channel (POS terminals, kiosk/back-store
  # displays, platform console). Only exercised when storeql.notification.channel=mqtt — the default
  # (app) never talks to it, so it's deliberately not in x-svc-depends.
  #
  # EMQX (not Mosquitto): a device authenticates with its existing storeql platform access token,
  # which the broker verifies against the public keys iam-svc publishes (20.15) — it holds nothing
  # that can sign one. notification-svc's publisher connection has its own password instead
  # (MQTT_PUBLISHER_PASSWORD), loaded from the bootstrap file below. Auth+ACL config is in
  # infra/emqx.conf / infra/emqx-acl.conf, verified against a running broker by the MqttAclIT and
  # MqttSessionRevokerIT Testcontainers tests.
  # 1883 = plain MQTT (notification-svc's publisher connection); 8083 = MQTT-over-WebSocket (the
  # Flutter admin/platform-console/POS shells, which can't open a raw TCP socket from a browser).
  mqtt:
    image: emqx/emqx:5.8.0
    container_name: storeql-mqtt
    restart: unless-stopped
    configs:
      - source: mqtt_auth_bootstrap
        target: /opt/emqx/etc/auth-bootstrap.csv
    volumes:
      - ./infra/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./infra/emqx-acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./infra/emqx-api-key.conf:/opt/emqx/etc/api-key.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083" # dashboard — local debugging only, admin/public by default
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: storeql-zipkin
    restart: unless-stopped
    ports: ["127.0.0.1:9411:9411"]
    environment:
      JAVA_OPTS: "${ZIPKIN_JAVA_OPTS:--Xms128m -Xmx512m}"
    mem_limit: ${ZIPKIN_MEM_LIMIT:-700m}
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # OTEL Collector — every service's only telemetry sink (OTLP traces+logs); exports
  # traces → Tempo+Zipkin, logs → Loki. Host-exposed so a service run outside docker
  # (against the rest of the dockerized stack) can still ship via OTLP.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: storeql-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports: ["127.0.0.1:4317:4317"]
    environment:
      # The collector is Go, so there is no -Xmx equivalent: without a limit the runtime sizes the
      # heap against the HOST's memory and only collects once it is already past the container cap.
      # Set just under mem_limit so GC gets aggressive before the cgroup OOM-killer intervenes.
      GOMEMLIMIT: "460MiB"
    # Paired with the memory_limiter processor in infra/otel-collector-config.yaml, whose
    # limit_mib (400) is ~80% of this. Change one and change the other: sized above this, the
    # container is killed before the processor can shed load. This was the only telemetry
    # container without a cap while receiving traces AND logs from all 14 services.
    mem_limit: ${OTEL_COLLECTOR_MEM_LIMIT:-512m}
    depends_on:
      zipkin: { condition: service_healthy }
      loki:   { condition: service_healthy }
      tempo:  { condition: service_healthy }
    networks: [storeql_network]

  # node_exporter — host CPU, memory, disk, network metrics (internal only).
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: storeql-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # The backup job's metrics (when it last succeeded, how big, encrypted or not) — see the
      # backups alert group in infra/prometheus/rules/alerts.yml.
      - '--collector.textfile.directory=/backups/metrics'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - backups:/backups:ro
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # postgres_exporter — internal; scraped by Prometheus.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: storeql-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-storeql}:${POSTGRES_PASSWORD:-storeql_dev_change_me}@postgres:5432/${POSTGRES_DB:-storeql}?sslmode=disable"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # redis_exporter — internal; scraped by Prometheus.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: storeql-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_change_me}
    depends_on:
      redis: { condition: service_healthy }
    networks: [storeql_network]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: storeql-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: storeql-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_dev_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3100}:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
      loki:       { condition: service_healthy }
      tempo:      { condition: service_healthy }
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin — http://localhost:5555
  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: storeql-pgadmin
    restart: unless-stopped
    ports: ["127.0.0.1:${PGADMIN_PORT:-5555}:80"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@storeql.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev_change_me}
    volumes: ["pgadmin_data:/var/lib/pgadmin"]
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- observability: logs + traces

  # Loki — log aggregation backend (internal; access via Grafana Explore).
  loki:
    image: grafana/loki:3.1.0
    container_name: storeql-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    mem_limit: ${LOKI_MEM_LIMIT:-512m}
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Tempo — distributed tracing backend (internal; access via Grafana Explore).
  tempo:
    image: grafana/tempo:2.5.0
    container_name: storeql-tempo
    restart: unless-stopped
    user: root
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./infra/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    mem_limit: ${TEMPO_MEM_LIMIT:-512m}
    networks: [storeql_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------- platform services

  config:
    image: ghcr.io/red2n/storeql-config:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: platform/config, SVC_JAR: config-svc }
    container_name: storeql-config
    restart: unless-stopped
    environment:
      server.port: "8080"
      # Not covered by x-svc-env (config declares its own environment) — see that anchor.
      STOREQL_LOG_LEVEL: ${STOREQL_LOG_LEVEL:-INFO}
      JAVA_TOOL_OPTIONS: "${CONFIG_JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
      STOREQL_CONFIG_TOKEN: ${STOREQL_CONFIG_TOKEN:?STOREQL_CONFIG_TOKEN must be set (>= 32 chars) - see .env.example}
      otel.exporter.otlp.endpoint: http://otel-collector:4317
    mem_limit: ${CONFIG_MEM_LIMIT:-384m}
    networks: [storeql_network]
    depends_on:
      consul: { condition: service_healthy }
    healthcheck:
      # /health/ready, not the aggregate /health: what depends_on waits for is "can it serve",
      # and a probe pointed at the aggregate takes on every check a service ever registers.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------- business services

  iam-svc:
    image: ghcr.io/red2n/storeql-iam-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/iam-svc, SVC_JAR: iam-svc }
    container_name: storeql-iam
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: iam_svc
      storeql.db.password: ${IAM_DB_PASSWORD:-iam_dev_change_me}
      JAVA_TOOL_OPTIONS: "${IAM_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: iam-svc
      # Seals the token signing keys' private halves at rest (20.15). It signs nothing: tokens are
      # RS256 under a rotating key, and only iam-svc is given this value.
      storeql.jwt.secret: ${STOREQL_JWT_SECRET:?STOREQL_JWT_SECRET must be set (>= 32 chars) - see .env.example}
      # Best-effort: on logout, kick the user's live MQTT push session (infra/emqx-api-key.conf)
      # instead of leaving it connected until the JWT naturally expires. infra/emqx-api-key.conf
      # is a static file, NOT templated from these env vars — if you override
      # EMQX_API_KEY/EMQX_API_SECRET here, update that file to match, or the kick calls will
      # 401 (harmlessly: logout still succeeds, the session just isn't force-disconnected).
      storeql.mqtt.admin-api-url: http://mqtt:18083
      storeql.mqtt.admin-api-key: ${EMQX_API_KEY:-iam-svc}
      storeql.mqtt.admin-api-secret: ${EMQX_API_SECRET:-iam_mqtt_admin_dev_change_me}
      # Single sign-on (20.x). The callback is iam-svc's as a browser reaches it, through the
      # gateway: what a business registers with its identity provider. A sign-in returns only to
      # the app's own origins — the same ones the gateway's CORS lets in. mock-idp is the one host
      # iam-svc may call over plain HTTP and at a private address; a real provider is HTTPS on the
      # internet, and the list is empty anywhere but here.
      storeql.sso.callback-url: ${SSO_CALLBACK_URL:-http://localhost:8090/api/iam-svc/auth/sso/callback}
      storeql.sso.return-origins: ${SSO_RETURN_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:40015,http://127.0.0.1:40015}
      storeql.sso.insecure-hosts: ${SSO_INSECURE_HOSTS:-mock-idp}
      # The link in a password-reset email opens the web app from outside: the address a person
      # can reach, not the container's.
      storeql.platform.web-url: ${UI_PUBLIC_URL:-http://localhost:${UI_HOST_PORT:-8088}}
    mem_limit: ${IAM_MEM_LIMIT:-700m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  tenant-svc:
    image: ghcr.io/red2n/storeql-tenant-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/tenant-svc, SVC_JAR: tenant-svc }
    container_name: storeql-tenant
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: tenant_svc
      storeql.db.password: ${TENANT_DB_PASSWORD:-tenant_dev_change_me}
      JAVA_TOOL_OPTIONS: "${TENANT_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: tenant-svc
      # The billing run may be asked for a day other than today (21.9). On here so a live flow can
      # drive a year of periods in seconds — Stripe ships a test clock for the same reason — and off
      # in k8s, where a platform administrator being able to bill next March is not a feature but a
      # way to issue an invoice nobody owes yet.
      storeql.billing.test-clock.enabled: "true"
      # The pay link in a dunning notice opens the web app from outside (21.12): the address a
      # business's owner can reach, not the container's.
      storeql.platform.web-url: ${UI_PUBLIC_URL:-http://localhost:${UI_HOST_PORT:-8088}}
    mem_limit: ${TENANT_MEM_LIMIT:-700m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  inventory-svc:
    image: ghcr.io/red2n/storeql-inventory-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/inventory-svc, SVC_JAR: inventory-svc }
    container_name: storeql-inventory
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: inventory_svc
      storeql.db.password: ${INVENTORY_DB_PASSWORD:-inventory_dev_change_me}
      JAVA_TOOL_OPTIONS: "${INVENTORY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: inventory-svc
    mem_limit: ${INVENTORY_MEM_LIMIT:-700m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  order-svc:
    image: ghcr.io/red2n/storeql-order-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/order-svc, SVC_JAR: order-svc }
    container_name: storeql-order
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: order_svc
      storeql.db.password: ${ORDER_DB_PASSWORD:-order_dev_change_me}
      JAVA_TOOL_OPTIONS: "${ORDER_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: order-svc
      # Gap #63 — order-svc resolves prices from pricing-svc, ignoring client-supplied prices.
      # Defaults to true (secure); set STOREQL_ORDER_PRICING_ENFORCE=false only for local dev/demo
      # with an unseeded price catalogue.
      storeql.order.pricing.enforce: ${STOREQL_ORDER_PRICING_ENFORCE:-true}
      # Checkout stock holds for ONLINE orders. Defaults to false in this dev rig (mirrors
      # pricing.enforce): with no seeded inventory every online checkout would 409 on stock.
      storeql.order.inventory.reserve-enforce: ${STOREQL_ORDER_RESERVE_ENFORCE:-false}
      # 18.5 fiscal regimes: the Portuguese signing key and the cloud TSE credentials are secrets
      # passed through from the environment. Empty means PT_SAFT cannot be set and CLOUD is not
      # offered; SIMULATED needs nothing.
      storeql.fiscal.pt.private-key: ${STOREQL_FISCAL_PT_PRIVATE_KEY:-}
      storeql.fiscal.pt.producer-tax-id: ${STOREQL_FISCAL_PT_PRODUCER_TAX_ID:-}
      storeql.fiscal.tse.cloud.api-key: ${STOREQL_FISCAL_TSE_CLOUD_API_KEY:-}
      storeql.fiscal.tse.cloud.api-secret: ${STOREQL_FISCAL_TSE_CLOUD_API_SECRET:-}
      # 07.13 / 18.9, the e-invoicing transport seam: the key the simulated network presents when it
      # delivers a document into purchase-svc's inbox. The same value purchase-svc holds it against.
      storeql.einvoice.inbound.key: ${STOREQL_EINVOICE_INBOUND_KEY:-dev-einvoice-inbound-key}
    mem_limit: ${ORDER_MEM_LIMIT:-700m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  purchase-svc:
    image: ghcr.io/red2n/storeql-purchase-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/purchase-svc, SVC_JAR: purchase-svc }
    container_name: storeql-purchase
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: purchase_svc
      storeql.db.password: ${PURCHASE_DB_PASSWORD:-purchase_dev_change_me}
      # Spend authority for submitting a purchase order, as CURRENCY:ROLE:amount.
      # Empty by default, which leaves approval OFF and submission behaving as it did before the
      # feature existed — turning mandatory approval on for every tenant already trading is not a
      # change to make in a config default. Per currency because there is no FX to convert with.
      storeql.purchase.approval.limits: ${PURCHASE_APPROVAL_LIMITS:-}
      # 07.13, the transport seam: the key every network's provider presents when it delivers a
      # supplier's e-invoice (POST /e-invoices/inbound/{network}). Empty means no deliveries at all.
      # A real access point contract gets its own value; the dev default only lets order-svc's
      # simulated network deliver between the businesses on this stack.
      storeql.einvoice.inbound.key: ${STOREQL_EINVOICE_INBOUND_KEY:-dev-einvoice-inbound-key}
      # Accounting connectors (17.9): the tokens a business's package issued are sealed under
      # this key (16, 24 or 32 bytes, base64) — see .env.example.
      storeql.accounting.secrets-key: ${STOREQL_ACCOUNTING_SECRETS_KEY:-vyZCf8bWkchYrFCuJiHWqwh5mTSEykU+wRPHbL7nkok=}
      JAVA_TOOL_OPTIONS: "${PURCHASE_JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: purchase-svc
    mem_limit: ${PURCHASE_MEM_LIMIT:-512m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  cart-svc:
    image: ghcr.io/red2n/storeql-cart-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/cart-svc, SVC_JAR: cart-svc }
    container_name: storeql-cart
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: cart_svc
      storeql.db.password: ${CART_DB_PASSWORD:-cart_dev_change_me}
      JAVA_TOOL_OPTIONS: "${CART_JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: cart-svc
      # Backs the cart/cart-items cache-aside reads (see CartRepository).
      storeql.redis.host: redis
      storeql.redis.port: "6379"
      storeql.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
    mem_limit: ${CART_MEM_LIMIT:-512m}
    networks: [storeql_network]
    depends_on:
      <<: *svc-depends
      redis: { condition: service_healthy }
    healthcheck: *svc-healthcheck

  pricing-svc:
    image: ghcr.io/red2n/storeql-pricing-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/pricing-svc, SVC_JAR: pricing-svc }
    container_name: storeql-pricing
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: pricing_svc
      storeql.db.password: ${PRICING_DB_PASSWORD:-pricing_dev_change_me}
      # 18.5 Making Tax Digital: HMRC's application credentials and the key the taxpayer's tokens
      # are held under. Empty means HMRC is not offered; SIMULATED needs nothing.
      storeql.mtd.hmrc.base-url: ${STOREQL_MTD_HMRC_BASE_URL:-https://test-api.service.hmrc.gov.uk}
      storeql.mtd.hmrc.client-id: ${STOREQL_MTD_HMRC_CLIENT_ID:-}
      storeql.mtd.hmrc.client-secret: ${STOREQL_MTD_HMRC_CLIENT_SECRET:-}
      storeql.mtd.token-key: ${STOREQL_MTD_TOKEN_KEY:-}
      JAVA_TOOL_OPTIONS: "${PRICING_JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: pricing-svc
    mem_limit: ${PRICING_MEM_LIMIT:-512m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  payment-svc:
    image: ghcr.io/red2n/storeql-payment-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/payment-svc, SVC_JAR: payment-svc }
    container_name: storeql-payment
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: payment_svc
      storeql.db.password: ${PAYMENT_DB_PASSWORD:-payment_dev_change_me}
      JAVA_TOOL_OPTIONS: "${PAYMENT_JAVA_OPTS:--Xms128m -Xmx256m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: payment-svc
    mem_limit: ${PAYMENT_MEM_LIMIT:-384m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  product-svc:
    image: ghcr.io/red2n/storeql-product-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/product-svc, SVC_JAR: product-svc }
    container_name: storeql-product
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: product_svc
      storeql.db.password: ${PRODUCT_DB_PASSWORD:-product_dev_change_me}
      JAVA_TOOL_OPTIONS: "${PRODUCT_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: product-svc
      # Backs the findProduct cache-aside read (see ProductRepository).
      storeql.redis.host: redis
      storeql.redis.port: "6379"
      storeql.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
    mem_limit: ${PRODUCT_MEM_LIMIT:-700m}
    networks: [storeql_network]
    depends_on:
      <<: *svc-depends
      redis: { condition: service_healthy }
    healthcheck: *svc-healthcheck

  customer-svc:
    image: ghcr.io/red2n/storeql-customer-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/customer-svc, SVC_JAR: customer-svc }
    container_name: storeql-customer
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: customer_svc
      storeql.db.password: ${CUSTOMER_DB_PASSWORD:-customer_dev_change_me}
      JAVA_TOOL_OPTIONS: "${CUSTOMER_JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: customer-svc
    mem_limit: ${CUSTOMER_MEM_LIMIT:-512m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  notification-svc:
    image: ghcr.io/red2n/storeql-notification-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/notification-svc, SVC_JAR: notification-svc }
    container_name: storeql-notification
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: notification_svc
      storeql.db.password: ${NOTIFICATION_DB_PASSWORD:-notification_dev_change_me}
      JAVA_TOOL_OPTIONS: "${NOTIFICATION_JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: notification-svc
      # Email on in the dev stack: every message is emailed to the mail catcher as well as kept in
      # the in-app feed, and a password reset — which goes by email only — can be delivered at all.
      # NOTIFICATION_CHANNEL=app turns email off (resets are then logged NOT_SENT); mqtt adds the
      # device push instead. The publisher connection has its own broker password (20.15):
      # notification-svc holds nothing that can sign a platform token.
      storeql.notification.channel: ${NOTIFICATION_CHANNEL:-email}
      storeql.notification.smtp.host: ${SMTP_HOST:-mailpit}
      storeql.notification.smtp.port: ${SMTP_PORT:-1025}
      storeql.notification.smtp.starttls: ${SMTP_STARTTLS:-false}
      storeql.notification.from: ${NOTIFICATION_FROM:-no-reply@storeql.local}
      storeql.notification.mqtt.host: mqtt
      storeql.notification.mqtt.publisher-password: ${MQTT_PUBLISHER_PASSWORD:?MQTT_PUBLISHER_PASSWORD must be set - see .env.example}
      # Webhooks to a business's own systems (22.6): each endpoint's signing secret is sealed under
      # this key (16, 24 or 32 bytes, base64) — see .env.example. webhook-sink is the stand-in
      # receiver k6 drives; it is reached over plain HTTP on the compose network and nowhere else.
      storeql.webhooks.secrets-key: ${STOREQL_WEBHOOKS_SECRETS_KEY:-vyZCf8bWkchYrFCuJiHWqwh5mTSEykU+wRPHbL7nkok=}
      storeql.webhooks.insecure-hosts: webhook-sink
    mem_limit: ${NOTIFICATION_MEM_LIMIT:-512m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  reporting-svc:
    image: ghcr.io/red2n/storeql-reporting-svc:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/reporting-svc, SVC_JAR: reporting-svc }
    container_name: storeql-reporting
    restart: unless-stopped
    environment:
      <<: *svc-env
      storeql.db.user: reporting_svc
      storeql.db.password: ${REPORTING_DB_PASSWORD:-reporting_dev_change_me}
      JAVA_TOOL_OPTIONS: "${REPORTING_JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseG1GC}"
      STOREQL_ADVERTISE_HOST: reporting-svc
    mem_limit: ${REPORTING_MEM_LIMIT:-512m}
    networks: [storeql_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  # ---------------------------------------------------------------- gateway (single public door)

  # Gateway waits for iam-svc and tenant-svc: these are the services clients hit first.
  # All others register with Consul and are discoverable once healthy.
  gateway:
    image: ghcr.io/red2n/storeql-gateway:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: platform/gateway, SVC_JAR: gateway }
    container_name: storeql-gateway
    restart: unless-stopped
    environment:
      server.port: "8080"
      # Not covered by x-svc-env (the gateway declares its own environment) — see that anchor.
      STOREQL_LOG_LEVEL: ${STOREQL_LOG_LEVEL:-INFO}
      JAVA_TOOL_OPTIONS: "${GATEWAY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      storeql.consul.host: consul
      storeql.consul.port: "8500"
      # Per-IP budget. The k6 regression suite drives ~50 VUs from one host IP and peaks
      # well above 10k/min; 10k caused mid-run 429 cascades. Local-dev/load-test value only.
      storeql.gateway.rate-limit.requests-per-minute: "30000"
      # Script integrity on the web shell (PCI DSS 11.6.1): the monitor reads the shell's inventory
      # and checks the served scripts against it on a schedule; drift is a gauge Prometheus alerts on.
      storeql.gateway.script-integrity.web-url: http://storeql-app:8080
      storeql.gateway.script-integrity.interval-minutes: "${GATEWAY_SCRIPT_INTEGRITY_INTERVAL_MINUTES:-60}"
      # No token secret here (20.15): the gateway verifies RS256 tokens against the public keys
      # iam-svc publishes and can mint nothing.
      otel.exporter.otlp.endpoint: http://otel-collector:4317
      # Browser origins that may call the API. The web UI (8088) and `flutter run` (40015) on this
      # machine by default; add http://<LAN-IP>:8088 for phone/tablet testing. Never "*": any
      # site a signed-in user visits could then read the API through their browser.
      storeql.gateway.cors.allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:40015,http://127.0.0.1:40015}
      # Bulk admin operations (e.g. CSV catalog import) process thousands of rows
      # synchronously upstream; the 10s code default is tuned for normal request/response
      # calls and times out well before a large import finishes server-side.
      storeql.gateway.upstream.read-timeout-seconds: "${GATEWAY_UPSTREAM_READ_TIMEOUT_SECONDS:-120}"
      # Rate-limit / brute-force counters live here, shared across every gateway replica.
      storeql.redis.host: redis
      storeql.redis.port: "6379"
      storeql.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
      # /.well-known/security.txt (RFC 9116). Empty means not published — see .env.example.
      storeql.gateway.security-txt.contact: ${SECURITY_TXT_CONTACT:-}
      storeql.gateway.security-txt.expires: ${SECURITY_TXT_EXPIRES:-}
      storeql.gateway.security-txt.policy: ${SECURITY_TXT_POLICY:-}
      storeql.gateway.security-txt.canonical: ${SECURITY_TXT_CANONICAL:-}
      storeql.gateway.security-txt.preferred-languages: ${SECURITY_TXT_PREFERRED_LANGUAGES:-}
    mem_limit: ${GATEWAY_MEM_LIMIT:-700m}
    # 0.0.0.0 binding: reachable from other devices on the LAN (needed for
    # phone/tablet testing of the storefront/POS). Host firewall is the only thing
    # standing between this and the public internet if this machine is ever
    # directly exposed — keep it behind a router/NAT.
    ports: ["${GATEWAY_HOST_PORT:-8090}:8080"]
    networks: [storeql_network]
    depends_on:
      consul:     { condition: service_healthy }
      iam-svc:    { condition: service_healthy }
      tenant-svc: { condition: service_healthy }
      redis:      { condition: service_healthy }
    healthcheck:
      # /health/ready, not the aggregate /health: what depends_on waits for is "can it serve",
      # and a probe pointed at the aggregate takes on every check a service ever registers.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: seeds the PLATFORM_ADMIN on a fresh DB. Safe to re-run — the bootstrap
  # endpoint returns 409 if an admin already exists, which we treat as success.
  bootstrap:
    image: curlimages/curl:8.7.1
    container_name: storeql-bootstrap
    restart: "no"
    networks: [storeql_network]
    depends_on:
      gateway: { condition: service_healthy }
      iam-svc: { condition: service_healthy }
    environment:
      ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@storeql.dev}
      ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD must be set - see .env.example}
      # The administrator's authenticator secret, base 32 (20.12): the account is born with its
      # second factor, so the most powerful login here never exists with a password alone. Put the
      # same secret in an authenticator app (redeploy.sh prints the otpauth:// line for it).
      ADMIN_TOTP_SECRET: ${PLATFORM_ADMIN_TOTP_SECRET:?PLATFORM_ADMIN_TOTP_SECRET must be set - see .env.example}
    command:
      - sh
      - -c
      - |
        # The gateway being healthy does not mean iam-svc is routable through it yet: discovery
        # lags the container's own health by a few seconds, and a 502/503/504 in that window used
        # to end this one-shot job for good — leaving a stack with no platform administrator at
        # all. Answers that mean "not yet" are retried; 201 and 409 are the only ways out.
        for attempt in $$(seq 1 60); do
          STATUS=$$(curl -s -o /dev/null -w '%{http_code}' -X POST http://gateway:8080/api/iam-svc/bootstrap/admin -H 'Content-Type: application/json' -d "{\"email\":\"$$ADMIN_EMAIL\",\"password\":\"$$ADMIN_PASSWORD\",\"totpSecret\":\"$$ADMIN_TOTP_SECRET\"}");
          if [ "$$STATUS" = "201" ]; then echo "[bootstrap] Platform admin created ($$ADMIN_EMAIL)"; exit 0;
          elif [ "$$STATUS" = "409" ]; then echo "[bootstrap] Platform admin already exists — skipped"; exit 0;
          elif [ "$$STATUS" = "000" ] || [ "$$STATUS" = "502" ] || [ "$$STATUS" = "503" ] || [ "$$STATUS" = "504" ]; then
            echo "[bootstrap] iam-svc not routable yet ($$STATUS), retrying ($$attempt/60)"; sleep 5;
          else echo "[bootstrap] Unexpected status $$STATUS"; exit 1; fi
        done
        echo "[bootstrap] iam-svc never became routable"; exit 1

  # ---------------------------------------------------------------- web UI (Flutter)

  # Single-page app (admin console + storefront + in-store POS), served by a
  # non-root nginx. The browser calls the gateway directly at the host URL baked
  # in at build time (STOREQL_API_BASE, default http://localhost:8090/api), so the
  # UI container itself never needs to reach the gateway over the compose network.
  storeql-app:
    image: ghcr.io/red2n/storeql-web:${STOREQL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: storeql-web
    restart: unless-stopped
    # Default 8088 to avoid clashing with the dev `flutter run` server (40015).
    # 0.0.0.0 binding: same reasoning as gateway — reachable from other devices on the LAN.
    ports: ["${UI_HOST_PORT:-8088}:8080"]
    # Bind-mount (not baked into the image) so the /api/ proxy and the security headers apply
    # even to images already published to ghcr.io/red2n — required for `redeploy.sh --pull`,
    # which never rebuilds this image locally. A template: the entrypoint renders it with the
    # environment below into conf.d/default.conf.
    volumes:
      - ./infra/nginx-spa.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # The gateway origin the bundle calls, for the Content-Security-Policy's connect-src.
      # Match the STOREQL_API_BASE the bundle was built with; empty for a relative /api build.
      STOREQL_API_ORIGIN: "${UI_API_ORIGIN:-http://localhost:8090}"
    networks: [storeql_network]
    depends_on:
      gateway: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s
