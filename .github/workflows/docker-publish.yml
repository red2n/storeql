name: Build & Publish Docker Images

# Triggers on every merge to main and on version tags.
# CI (ci.yml) gates quality; this workflow only publishes — it skips tests.
#
# Supply chain (22.10): every image is pushed with BuildKit's SBOM and max-mode provenance
# attestations, then gets three things bound to its digest — a CycloneDX SBOM attestation and a
# SLSA build-provenance attestation (GitHub artifact attestations, pushed to the registry beside
# the image), and a keyless Sigstore signature (cosign; the certificate names this workflow at this
# ref, no key is kept anywhere). scripts/verify-release.sh checks all three; docs/RELEASE-PROCESS.md
# says how. Before any of that, the pushed image is scanned for known vulnerabilities (22.11): one
# that fails is never signed. scripts/supply-chain-check.py fails CI if this file stops doing any
# of it.
#
# Build-once-per-service, no-artifact design: each service image used to be
# built + pushed sequentially in ONE job off a single full-reactor `mvn install`.
# That job kept accumulating Maven target/ output and Docker layers across all
# 15 images on the same runner disk with nothing ever freed mid-job, and it
# eventually ran the runner out of disk space and failed the publish for every
# service, not just the one that tipped it over. Building via a matrix — one
# fresh runner (fresh disk) per service — removes the cumulative growth
# entirely and isolates failures (one bad service image no longer blocks the
# rest). Each matrix leg builds only its own module + reactor deps
# (`-pl <path> -am`), not the full reactor, to keep the redundant shared-module
# rebuild across legs cheap. We still deliberately do NOT hand JARs between
# jobs via actions/upload-artifact: the bundled per-service target/libs trees
# are ~700 MB per run and, even at a 1-day retention, expired artifacts keep
# counting against the (small) storage quota until GitHub's 6–12h purge —
# which is what broke the deploy before. No artifact upload == no artifact
# storage consumed.
on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# A new push to the same ref supersedes any in-flight publish for that ref —
# stops runs piling up (and racing each other's GHCR writes/cleanup) when
# several PRs merge to main in quick succession.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Produces e.g. ghcr.io/red2n/storeql-gateway
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/storeql
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  # ── One job per service: fresh runner disk each time, no accumulation ──────
  services:
    name: Build & publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and attestations: the job proves to Sigstore who it is
      attestations: write # GitHub artifact attestations (SBOM, SLSA provenance)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      # name/path/jar — must stay in sync with the service catalog.
      matrix:
        include:
          # Platform
          - { name: gateway, path: platform/gateway, jar: gateway }
          - { name: config, path: platform/config, jar: config-svc }
          # Business — Phase 1 (back-office)
          - { name: iam-svc, path: services/iam-svc, jar: iam-svc }
          - { name: tenant-svc, path: services/tenant-svc, jar: tenant-svc }
          - { name: product-svc, path: services/product-svc, jar: product-svc }
          - { name: inventory-svc, path: services/inventory-svc, jar: inventory-svc }
          - { name: purchase-svc, path: services/purchase-svc, jar: purchase-svc }
          # Business — Phase 2 (commerce)
          - { name: pricing-svc, path: services/pricing-svc, jar: pricing-svc }
          - { name: cart-svc, path: services/cart-svc, jar: cart-svc }
          - { name: order-svc, path: services/order-svc, jar: order-svc }
          - { name: payment-svc, path: services/payment-svc, jar: payment-svc }
          # Business — Phase 3 (experience)
          - { name: customer-svc, path: services/customer-svc, jar: customer-svc }
          - { name: notification-svc, path: services/notification-svc, jar: notification-svc }
          - { name: reporting-svc, path: services/reporting-svc, jar: reporting-svc }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Only this module + the shared reactor modules it depends on — not the
      # full 20-module reactor. Cheaper per leg and keeps this job's disk
      # footprint small regardless of how many services the matrix fans out to.
      - name: Build ${{ matrix.name }} (+ reactor deps)
        run: mvn -B -V -pl ${{ matrix.path }} -am clean install -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }} image
        id: build
        run: |
          set -euo pipefail

          # Tag suffixes (mirrors docker/metadata-action):
          #   - sha-<short>                 always
          #   - <version>/<maj.min>/<maj>   on v*.*.* tag pushes
          #   - <branch> + latest           on default-branch pushes / dispatch
          suffixes=("sha-$(echo "${GITHUB_SHA}" | cut -c1-7)")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            suffixes+=("$version" "${version%.*}" "${version%%.*}")
          else
            suffixes+=("${GITHUB_REF_NAME}")
            if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
              suffixes+=("latest")
            fi
          fi

          image="${IMAGE_PREFIX}-${{ matrix.name }}"
          tag_args=()
          for s in "${suffixes[@]}"; do
            tag_args+=("-t" "${image}:${s}")
          done

          # BuildKit attaches its own SBOM and max-mode provenance (the build's inputs, arguments
          # and steps) to the image index. They show up as extra untagged GHCR versions; the
          # cleanup job treats them as children of the image they belong to, not as leftovers.
          docker buildx build \
            --push \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "${RUNNER_TEMP}/build-metadata.json" \
            --file Dockerfile.svc \
            --build-arg "SVC_PATH=${{ matrix.path }}" \
            --build-arg "SVC_JAR=${{ matrix.jar }}" \
            "${tag_args[@]}" \
            .

          # What was pushed, by digest: a tag can be moved, a digest cannot, so everything below
          # is bound to this and nothing to a tag.
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/build-metadata.json")"
          [[ "${digest}" == sha256:* ]] || { echo "no digest for ${image}" >&2; exit 1; }
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          echo "Published \`${image}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      # Known vulnerabilities (22.11), before anything vouches for the image: a High or Critical
      # finding without a current decision in security/vulnerability-exceptions.yaml stops the job
      # here, so the image is never signed or attested — and what is not signed does not verify.
      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Scan the pushed image
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IMAGE_REF: ${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/vuln-scan.sh image "registry:${IMAGE_REF}"

      # What the image contains: every OS package and every jar in it, as CycloneDX.
      - name: SBOM of the pushed image (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM to the image
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.cdx.json
          push-to-registry: true

      # Where it was built: this repository, this workflow, this commit, this runner (SLSA).
      - name: Attest build provenance to the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless: Sigstore issues a ten-minute certificate for this job's OIDC identity, the
      # signature goes to the registry and the transparency log, and no private key outlives it.
      - name: Sign the image
        env:
          IMAGE_REF: ${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

  # ── Build the Flutter web bundle and push its image (no artifacts) ─────────
  # Set STOREQL_API_BASE as a GitHub Actions repository variable (Settings →
  # Variables → Actions) to the production gateway URL, e.g.
  # https://api.example.com/api. Defaults to /api (relative — works when the
  # gateway and web app share a host or nginx proxies /api upstream).
  web:
    name: Build & publish web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and attestations
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must match the Flutter SDK devs build against locally: flutter_localizations
          # pins an exact intl version per-SDK, and pubspec.yaml's intl constraint is set
          # for the dev-machine SDK. A CI/dev version mismatch makes `pub get` unsolvable
          # (two different exact intl pins) — bump this together with local Flutter upgrades.
          # Keep in lockstep with ci.yml's flutter job: that one runs analyze and test, this
          # one ships the bundle, and a build that was never analysed on the same SDK is
          # exactly the gap this pair exists to close.
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontends/storeql-app
        run: flutter pub get

      - name: Flutter build web
        working-directory: frontends/storeql-app
        env:
          STOREQL_API_BASE: ${{ vars.STOREQL_API_BASE || '/api' }}
        # --no-web-resources-cdn serves CanvasKit from this image rather than www.gstatic.com, which
        # the Content-Security-Policy in infra/nginx-spa.conf.template does not allow. Without it the
        # bundle builds, ships, and then fails to load its renderer in the browser — and no test here
        # catches it, because k6's web-shell exercises the locally built image. Keep in lockstep with
        # Dockerfile.web's documented command and scripts/redeploy.sh.
        run: |
          flutter build web --release \
            --no-web-resources-cdn \
            --dart-define="STOREQL_API_BASE=${STOREQL_API_BASE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Known vulnerabilities (22.11), before anything vouches for the image — as for the services.
      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Scan the pushed image
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-web@${{ steps.build.outputs.digest }}
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/vuln-scan.sh image "registry:${IMAGE_REF}"

      # The image holds nginx and a compiled bundle: the image SBOM lists the OS packages, and the
      # bundle's own ingredients are the Dart packages pubspec.lock pinned — a second SBOM, from
      # the source tree the bundle was compiled from.
      - name: SBOM of the pushed image (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}-web@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM of the app's Dart packages (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: frontends/storeql-app
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom-app.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the image SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-web
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.cdx.json
          push-to-registry: true

      - name: Attest the app SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-web
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-app.cdx.json
          push-to-registry: true

      - name: Attest build provenance to the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-web@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

  backup:
    name: Build & publish backup image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and attestations
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-backup
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/backup/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Known vulnerabilities (22.11), before anything vouches for the image — as for the services.
      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Scan the pushed image
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-backup@${{ steps.build.outputs.digest }}
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/vuln-scan.sh image "registry:${IMAGE_REF}"

      # The Postgres image's own tools plus age and jq: one SBOM, of the image as pushed.
      - name: SBOM of the pushed image (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}-backup@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the image SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backup
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.cdx.json
          push-to-registry: true

      - name: Attest build provenance to the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backup
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-backup@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

  # ── Prune old GHCR versions: keep current + previous build per package ──────
  # A push never deletes the old image — it only moves the latest/main tags, so
  # every prior version lingers (still carrying its unique sha-<commit> tag) and
  # accumulates forever. This job keeps the 2 newest versions per package (so you
  # can still roll back one build) and deletes everything older, plus any
  # untagged leftovers. Runs only on default-branch / tag publishes, never on a
  # workflow_dispatch from a feature branch.
  #
  # always(): with fail-fast:false on the services matrix, one flaky service
  # must not skip pruning for the other 14 that published fine — ghcr-cleanup-
  # action's validate:true already no-ops safely on a package that never got
  # published this run.
  cleanup:
    name: Prune old GHCR versions
    needs: [services, web, backup]
    runs-on: ubuntu-latest
    if: >
      always() &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - storeql-gateway
          - storeql-config
          - storeql-iam-svc
          - storeql-tenant-svc
          - storeql-product-svc
          - storeql-inventory-svc
          - storeql-purchase-svc
          - storeql-pricing-svc
          - storeql-cart-svc
          - storeql-order-svc
          - storeql-payment-svc
          - storeql-customer-svc
          - storeql-notification-svc
          - storeql-reporting-svc
          - storeql-web
          - storeql-backup

    steps:
      - name: Keep last 2 versions of ${{ matrix.package }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ matrix.package }}
          # Keep the 2 most recent tagged versions (current + previous build).
          keep-n-tagged: 2
          # Remove dangling/untagged manifests left behind by older pushes. The action counts an
          # image's platform layers, attestations and cosign signatures as its children: they go
          # when it goes and stay while it stays, and are never pruned as "untagged" by themselves.
          delete-untagged: true
          # A signature or attestation (tagged sha256-<digest>...) whose image is already gone.
          delete-orphaned-images: true
          # Don't fail the run if a package doesn't exist yet (first publish).
          validate: true
