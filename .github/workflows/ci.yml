name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 (the jars still target release 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and verify
        run: mvn -U -B -V clean install

  # ── Frontend ───────────────────────────────────────────────────────────────
  # Separate job, not a step: it shares nothing with the Maven build and both
  # should report independently. Until this existed, `flutter analyze` and
  # `flutter test` ran nowhere — the only Flutter in CI was the release build in
  # docker-publish.yml, which runs after merge and skips tests. A Dart compile
  # error therefore surfaced on main, not on the PR that introduced it, which is
  # exactly how a top-level browser-only import (dart:js_interop, unavailable on
  # the VM and on mobile) sat unnoticed long enough to break every Android and
  # iOS build.
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must match docker-publish.yml's pin and the SDK devs run locally —
          # flutter_localizations pins an exact intl per SDK, so a mismatch makes
          # `pub get` unsolvable rather than merely different. pubspec.lock is
          # resolved by this version.
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontends/storeql-app
        run: flutter pub get

      # --fatal-infos because the tree is clean today and lint drift is only
      # cheap to fix while it is one line old. Drop the flag, don't delete the
      # step, if that ever becomes the wrong trade.
      - name: Flutter analyze
        working-directory: frontends/storeql-app
        run: flutter analyze --fatal-infos

      - name: Flutter test
        working-directory: frontends/storeql-app
        run: flutter test

      # SJ-D58: analyze and test run on the VM, where a conditional import's native half is the only
      # half compiled. A function missing from the web half (saveTextFile) passed both and broke every
      # web build for a day and a half, unseen, while images shipped the last good bundle. Compile it.
      - name: Flutter web compiles
        working-directory: frontends/storeql-app
        run: flutter build web --release --no-wasm-dry-run --no-web-resources-cdn

  # The Kubernetes manifests: schema-valid (kubeconform, strict) and hardened as the platform
  # promises — Pod Security Standards restricted, default-deny NetworkPolicy, Postgres reachable
  # from the pooler alone (scripts/k8s-hardening-check.py).
  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate and check the manifests
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/k8s-check.sh

  # The container healthcheck of every Java image (intent/jdk-25.md): the Temurin 25 JRE image has no
  # curl, wget or nc, so a healthcheck that used one reports every service unhealthy and the stack never
  # starts, which is what reverted the first move to 25. The script is proved against real servers on
  # this machine and inside the 21 and 25 base images; the files are checked so that no compose
  # healthcheck or Kubernetes probe of a Java image can use a tool the image lacks.
  healthchecks:
    name: Container healthchecks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the compose healthchecks and the Kubernetes probes
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/compose-healthcheck-check.py --self-test
          scripts/compose-healthcheck-check.py

      - name: Prove the healthcheck script on this machine and in each base image
        run: scripts/healthcheck-selftest.sh

  # The migration freeze (intent/forward-only-migrations.md). Until the first release tag exists the
  # check passes and says so; from v0.1.0 a published migration is immutable, a new one is numbered
  # above the tag's highest and a destructive move carries its contract marker. The full history is
  # fetched because the check reads the tags.
  migrations:
    name: Migration freeze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prove the check, then run it
        run: |
          scripts/migration-freeze-check.py --self-test
          scripts/migration-freeze-check.py

      - name: Prove that a data wipe is refused on a machine that is not dev or ci
        run: scripts/redeploy-guard-selftest.sh

      - name: Prove the deploy script (backup before stop, the refusals, the rollback line)
        run: scripts/deploy-release-selftest.sh

  # The upgrade path (intent/forward-only-migrations.md), on a throwaway Postgres with the Flyway the
  # services run: release N+1 migrates N's database and keeps its data, N's code still runs on an
  # additive N+1, a contract release is not rollback-safe, an edited published file is refused.
  upgrade:
    name: Upgrade path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 (the jars still target release 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Prove the upgrade path
        run: |
          mvn -q -B -pl shared/common-service -am dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/flyway.cp"
          FLYWAY_CLASSPATH="$(cat "$RUNNER_TEMP/flyway.cp")" scripts/upgrade-selftest.sh

  # ── Alerting ───────────────────────────────────────────────────────────────
  # The alert rules (promtool check and unit tests: a healthy service must not alert, a restart must)
  # and the Prometheus and Alertmanager configs, read by the tools that will read them.
  alerting:
    name: Prometheus rules and Alertmanager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the configs and run the alert rule tests
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/prometheus-rules-check.sh

  # ── Backups ────────────────────────────────────────────────────────────────
  # The backup-restore drill's machinery, proved against throwaway containers: a backup from one
  # snapshot with its manifest, encrypted to a key the host cannot read with, a changed byte caught,
  # restored row for row, retention, and a base backup plus archived WAL recovered to a moment.
  backup:
    name: Backup self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Drive the backup, verify, restore and point-in-time recovery against throwaway containers
        run: scripts/backup-selftest.sh

      - name: Prove the off-site copy (verified, never deletes, refuses unencrypted dumps)
        run: scripts/offsite-backup-selftest.sh

  # The release path's supply-chain promises (22.10, 22.11): every published image built with an
  # SBOM and max-mode provenance, scanned for known vulnerabilities, then attested and signed by
  # digest; the release carrying its SBOM, checksums and provenance; the scan running on pull
  # requests, main and nightly; an update bot on all four ecosystems. The check reads the workflows; its self-test breaks each promise in memory and
  # fails unless the check notices. actionlint keeps the workflows themselves well-formed.
  supply-chain:
    name: Supply chain promises
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the workflows keep their promises
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/supply-chain-check.py
          scripts/supply-chain-check.py --self-test
          # Every vulnerability exception is a dated, reasoned decision (22.11) — or the build stops.
          scripts/vuln-scan.sh exceptions

      - name: Lint the workflows
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint .github/workflows/*.yml

