name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: mvn -U -B -V clean install

  # ── Frontend ───────────────────────────────────────────────────────────────
  # Separate job, not a step: it shares nothing with the Maven build and both
  # should report independently. Until this existed, `flutter analyze` and
  # `flutter test` ran nowhere — the only Flutter in CI was the release build in
  # docker-publish.yml, which runs after merge and skips tests. A Dart compile
  # error therefore surfaced on main, not on the PR that introduced it, which is
  # exactly how a top-level browser-only import (dart:js_interop, unavailable on
  # the VM and on mobile) sat unnoticed long enough to break every Android and
  # iOS build.
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must match docker-publish.yml's pin and the SDK devs run locally —
          # flutter_localizations pins an exact intl per SDK, so a mismatch makes
          # `pub get` unsolvable rather than merely different. pubspec.lock is
          # resolved by this version.
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontends/storeql-app
        run: flutter pub get

      # --fatal-infos because the tree is clean today and lint drift is only
      # cheap to fix while it is one line old. Drop the flag, don't delete the
      # step, if that ever becomes the wrong trade.
      - name: Flutter analyze
        working-directory: frontends/storeql-app
        run: flutter analyze --fatal-infos

      - name: Flutter test
        working-directory: frontends/storeql-app
        run: flutter test

      # SJ-D58: analyze and test run on the VM, where a conditional import's native half is the only
      # half compiled. A function missing from the web half (saveTextFile) passed both and broke every
      # web build for a day and a half, unseen, while images shipped the last good bundle. Compile it.
      - name: Flutter web compiles
        working-directory: frontends/storeql-app
        run: flutter build web --release --no-wasm-dry-run --no-web-resources-cdn

  # The Kubernetes manifests: schema-valid (kubeconform, strict) and hardened as the platform
  # promises — Pod Security Standards restricted, default-deny NetworkPolicy, Postgres reachable
  # from the pooler alone (scripts/k8s-hardening-check.py).
  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate and check the manifests
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/k8s-check.sh

  # The release path's supply-chain promises (22.10, 22.11): every published image built with an
  # SBOM and max-mode provenance, scanned for known vulnerabilities, then attested and signed by
  # digest; the release carrying its SBOM, checksums and provenance; the scan running on pull
  # requests, main and nightly; an update bot on all four ecosystems. The check reads the workflows; its self-test breaks each promise in memory and
  # fails unless the check notices. actionlint keeps the workflows themselves well-formed.
  # ── Backups ────────────────────────────────────────────────────────────────
  # The backup-restore drill's machinery, proved against throwaway containers: a backup from one
  # snapshot with its manifest, encrypted to a key the host cannot read with, a changed byte caught,
  # restored row for row, retention, and a base backup plus archived WAL recovered to a moment.
  backup:
    name: Backup self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Drive the backup, verify, restore and point-in-time recovery against throwaway containers
        run: scripts/backup-selftest.sh

  supply-chain:
    name: Supply chain promises
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the workflows keep their promises
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/supply-chain-check.py
          scripts/supply-chain-check.py --self-test
          # Every vulnerability exception is a dated, reasoned decision (22.11) — or the build stops.
          scripts/vuln-scan.sh exceptions

      - name: Lint the workflows
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint .github/workflows/*.yml

