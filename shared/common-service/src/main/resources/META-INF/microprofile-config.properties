# Tuning keys read by the shared infrastructure. EVERYTHING here is commented out: the value shown
# is the built-in default, so a service overrides one by setting the key in its own config.

# --- outbox relay (OutboxPublisher) ---
# Idle interval between drain ticks in milliseconds; 0 = use storeql.outbox.poll-seconds * 1000.
# storeql.outbox.poll-millis=0
# Rows claimed per batch; a tick keeps draining while batches come back full.
# storeql.outbox.batch-size=100
# Most time one tick may spend draining back-to-back batches.
# storeql.outbox.drain-budget-ms=5000

# --- operational purge (published outbox rows, processed_events dedupe rows) ---
# storeql.outbox.purge.enabled=1
# storeql.outbox.purge.interval-minutes=60
# Rows deleted per statement, and the most statements per kind per tick (bounds every purge).
# storeql.outbox.purge.batch-size=1000
# storeql.outbox.purge.max-batches=50
# Published outbox rows older than this are deleted (unpublished rows never are).
# storeql.outbox.retention-days=7
# processed_events must outlive possible redelivery: keep it LONGER than the longest Kafka topic
# retention plus consumer lag (Kafka's own default retention is 7 days).
# storeql.processed-events.retention-days=30

# --- Kafka consumers (KafkaEventLoop) ---
# Pause after a poll before the next one (poll itself already waits up to 500 ms for records).
# storeql.kafka.poll-delay-ms=50
# A consumer whose broker has not answered a metadata probe (one every 10 s) for this long is
# stalled: readiness reports DOWN until it answers again.
# storeql.kafka.stall-seconds=60
# max.poll.records: a batch must finish well inside max.poll.interval.ms.
# storeql.kafka.max-poll-records=100

# --- database ---
# A failed connection acquire that took longer than this (the pool's own wait) is not retried.
# storeql.db.acquire.retry-max-attempt-ms=1000

# --- cross-service reads (ServiceReader) ---
# Consecutive failed reads of one service before its circuit opens, and for how long.
# storeql.clients.breaker.failures=5
# storeql.clients.breaker.open-seconds=5
# Per-tenant caches (TenantProfiles, Entitlements, FxRates) are trimmed beyond this many tenants.
# storeql.cache.max-tenants=10000
