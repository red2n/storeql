# notification-svc — defaults (local dev).
storeql.service.name=notification-svc
server.port=8011
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/notification-svc/... instead of failing.
mp.openapi.servers=/api/notification-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=notification_svc
storeql.db.password=notification_dev_change_me
storeql.db.schema=notification

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
# Welcome + order-confirmation notification consumers.
storeql.kafka.topics.user-registered=storeql.iam.user-registered
storeql.kafka.topics.order-confirmed=storeql.order.order-confirmed
storeql.kafka.topics.order-fulfilled=storeql.order.order-fulfilled
storeql.kafka.topics.order-dispatched=storeql.order.order-dispatched
# Substitutions for out-of-stock online lines: an item unavailable, an item substituted.
storeql.kafka.topics.order-line-short-closed=storeql.order.order-line-short-closed
storeql.kafka.topics.order-line-substituted=storeql.order.order-line-substituted
# Forgot password: the email is sent by SMTP alone, through AccountEmailSender, never through
# storeql.notification.channel above — see SmtpAccountEmailSender. Its notification_log row is a
# platform rule, not a business's own NOTIFICATION_LOG schedule (it belongs to none): the daily
# RetentionSweeper deletes it after this many days, whatever login it was for.
storeql.kafka.topics.password-reset-requested=storeql.iam.password-reset-requested
storeql.kafka.topics.password-changed=storeql.iam.password-changed
storeql.notification.password-reset.retention-days=30

# Outbound notifications (N1). channel=app (default: in-app, persisted to notification_log and
# surfaced in the app), email (SMTP), or mqtt (device-facing push to POS/kiosk/platform console —
# see MqttChannel). SMS is a future channel. SMTP/MQTT host/credentials come from the environment /
# secret store, never committed.
storeql.notification.channel=app
storeql.notification.from=no-reply@storeql.local
storeql.notification.smtp.host=localhost
storeql.notification.smtp.port=587
# smtp.username / smtp.password are unset here — supply them via env/secret store when channel=email.
storeql.notification.smtp.starttls=true
# Network limits of one SMTP conversation (Jakarta Mail's own defaults are infinite) and the size of
# the platform-thread pool the sends run on (Transport is synchronized, so it would pin a virtual thread).
storeql.notification.smtp.connect-timeout-ms=5000
storeql.notification.smtp.read-timeout-ms=10000
storeql.notification.smtp.write-timeout-ms=10000
storeql.notification.smtp.sender-threads=4

# MQTT device-push (channel=mqtt): topic storeql/notifications/{tenantId}/{recipient}, recipient is
# the caller-chosen topic key (e.g. a store id for shortage alerts). The broker knows this
# service's publisher connection by its own password (20.15, see infra/emqx.conf) — it holds no key
# that can sign a platform token.
storeql.notification.mqtt.host=localhost
storeql.notification.mqtt.port=1883
storeql.notification.mqtt.client-id=notification-svc
storeql.notification.mqtt.tls=false

# storeql.notification.mqtt.publisher-password is intentionally NOT set here — it comes from the
# environment/secret store and matches the broker's bootstrap file. Only read when channel=mqtt.

otel.sdk.disabled=false
otel.service.name=notification-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# Webhooks to a business's own systems (22.6). The sealing key and the hosts reachable over plain
# HTTP come from the deployment (docker-compose: the dev key and webhook-sink); production sets its
# own key and names no insecure host.
storeql.webhooks.enabled=true
storeql.webhooks.poll-seconds=5
storeql.webhooks.batch=50
storeql.webhooks.timeout-seconds=10
storeql.webhooks.max-attempts=5
storeql.webhooks.disable-after-failures=20
storeql.webhooks.keep-days=30
# Webhook delivery: endpoints are sent concurrently (one at a time within an endpoint); an endpoint's
# turn is not begun after half the lease; settled deliveries are pruned hourly in batches.
storeql.webhooks.lease-seconds=120
storeql.webhooks.concurrency=8
storeql.webhooks.prune-interval-seconds=3600
storeql.webhooks.prune-batch=1000
storeql.webhooks.prune-max-batches-per-run=50
# Fan-out remembers "no endpoint listens" per business and event type for this long (0 = off).
storeql.webhooks.fanout-none-cache-seconds=30
storeql.webhooks.fanout-none-cache-max=10000
# Retention purge of the notification log: rows locked and deleted per transaction.
storeql.retention.batch=5000
# Parsed message templates kept by source text (0 = no cache); a full cache is emptied.
storeql.notification.template-cache-size=512
