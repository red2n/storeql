# customer-svc — defaults (local dev).
storeql.service.name=customer-svc
server.port=8013
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/customer-svc/... instead of failing.
mp.openapi.servers=/api/customer-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=customer_svc
storeql.db.password=customer_dev_change_me
storeql.db.schema=customer

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

# Kafka (outbox publisher + order-confirmed consumer for loyalty accrual)
storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
storeql.outbox.poll-seconds=5
storeql.kafka.topics.order-confirmed=storeql.order.order-confirmed

# Loyalty: points awarded per unit of order currency spent (1 → 1 point per £1).
storeql.customer.loyalty.points-per-unit=1
# Loyalty: how often points that have died are written off and tiers re-checked (13.x); 0 turns the sweeper off.
storeql.customer.loyalty.sweep-seconds=3600

otel.sdk.disabled=false
otel.service.name=customer-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0
