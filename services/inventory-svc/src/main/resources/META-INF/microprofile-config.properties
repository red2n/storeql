# inventory-svc — defaults (local dev).
storeql.service.name=inventory-svc
server.port=8004
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/inventory-svc/... instead of failing.
mp.openapi.servers=/api/inventory-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=inventory_svc
storeql.db.password=inventory_dev_change_me
storeql.db.schema=inventory

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
storeql.outbox.poll-seconds=5

# Gap #50 — POS→SIM sync: order event topics consumed by inventory-svc
storeql.kafka.topics.order-fulfilled=storeql.order.order-fulfilled
storeql.kafka.topics.order-returned=storeql.order.order-returned
storeql.kafka.topics.order-voided=storeql.order.order-voided
# Substitutions for out-of-stock online lines: a closed or replaced line gives its hold back (OrderEventConsumer)
storeql.kafka.topics.order-line-short-closed=storeql.order.order-line-short-closed
storeql.kafka.topics.order-line-substituted=storeql.order.order-line-substituted
# Wave picking: confirmed online orders wait to be picked at their store (AwaitingOrdersConsumer, its own group)
storeql.kafka.topics.order-confirmed=storeql.order.order-confirmed
# 07.8 — goods going back to the supplier leave stock here
storeql.kafka.topics.returned-to-vendor=storeql.purchase.returned-to-vendor
# 07.x landed cost: a charge on a receipt lifts (or a reversal lowers) the cost of its batches
storeql.kafka.topics.landed-cost-applied=storeql.purchase.landed-cost-applied
# 07.17 — a published planogram is what the shelf holds, and a retired fixture holds nothing
storeql.kafka.topics.shelf-capacity-published=storeql.catalog.shelf-capacity-published
storeql.kafka.topics.fixture-retired=storeql.catalog.fixture-retired

# Reservation lifetime (abandoned-cart auto-release) + sweeper interval
storeql.inventory.reservation-ttl-seconds=900
storeql.inventory.sweeper-seconds=30

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=inventory-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# Cross-docking: what a warehouse order owes its shops, as purchase-svc announces it (CrossDockConsumer)
storeql.kafka.topics.crossdock-allocations-set=storeql.purchase.crossdock-allocations-set
