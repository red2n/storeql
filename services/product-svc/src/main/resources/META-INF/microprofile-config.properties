# product-svc — defaults (local dev).
storeql.service.name=product-svc
server.port=8003
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/product-svc/... instead of failing.
mp.openapi.servers=/api/product-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=product_svc
storeql.db.password=product_dev_change_me
storeql.db.schema=product

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
storeql.outbox.poll-seconds=5

# Redis — backs the findProduct cache-aside read (see ProductRepository).
# storeql.redis.password is intentionally left at the docker-compose dev default here; override
# via environment in any deployment that changes REDIS_PASSWORD.
storeql.redis.host=localhost
storeql.redis.port=6379
storeql.redis.password=redis_dev_change_me

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=product-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# 07.18 — dated range changes are put into force on the day they said, without anybody pressing a
# button. Hourly rather than nightly so a deployment that was down overnight catches up on its next
# tick; applying twice is harmless, because a change is marked in the same transaction as the range
# it moved.
storeql.product.assortment-sweeper.enabled=true
storeql.product.assortment-sweeper.minutes=60

# Supplier import: the most lines one call to inventory-svc's batch receive carries. Keep it at or
# below inventory-svc's storeql.inventory.bulk.receive-max-lines (default 500), which refuses a
# longer call whole (400 INVENTORY_BULK_TOO_LARGE); a longer sheet is sent in calls of this size.
storeql.product.inventory.receive-max-lines=500
