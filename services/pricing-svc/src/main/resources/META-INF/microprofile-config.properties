# pricing-svc — defaults (local dev).
storeql.service.name=pricing-svc
server.port=8005
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/pricing-svc/... instead of failing.
mp.openapi.servers=/api/pricing-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=pricing_svc
storeql.db.password=pricing_dev_change_me
storeql.db.schema=pricing

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
storeql.outbox.poll-seconds=5

# OpenTelemetry
otel.sdk.disabled=false
otel.service.name=pricing-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317

# SJ-D39: input VAT for the return arrives from purchase-svc
storeql.kafka.topics.supplier-invoice-captured=storeql.purchase.supplier-invoice-captured

# 18.5 Making Tax Digital for VAT. SIMULATED files with an in-process HMRC; HMRC files with the
# real API and needs the application's credentials from HMRC's developer hub plus a key to hold the
# taxpayer's tokens under. All three are secrets: set them in the environment, never here.
# storeql.mtd.hmrc.base-url=https://test-api.service.hmrc.gov.uk
# storeql.mtd.hmrc.client-id=
# storeql.mtd.hmrc.client-secret=
# storeql.mtd.token-key=            (128/192/256-bit AES key, base64)
storeql.mtd.vendor.product-name=StoreQL
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# Hardening: bounds that keep memory and response sizes finite.
# Tenants whose "may advertise reductions" verdict is cached in memory (emptied when full).
storeql.pricing.verdict-cache.max-tenants=5000
# GET /price-lists/{id}/items is cursor-paged: page size when ?limit is absent, and its ceiling.
storeql.pricing.price-list-items.default-limit=500
storeql.pricing.price-list-items.max-limit=1000
