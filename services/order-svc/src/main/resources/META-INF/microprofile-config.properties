# order-svc — defaults (local dev).
storeql.service.name=order-svc
server.port=8007
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/order-svc/... instead of failing.
mp.openapi.servers=/api/order-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=order_svc
storeql.db.password=order_dev_change_me
storeql.db.schema=order

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

# Gap #63 — server-side pricing. When true (the secure default), placeOrder resolves every
# line's unit price from pricing-svc and ignores the client-supplied unitPrice.
# Override to false in docker-compose for local dev rigs without a seeded price catalogue.
storeql.order.pricing.enforce=true

storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
storeql.outbox.poll-seconds=5

# Gap #50 — SIM→POS sync: inventory event topics consumed by order-svc
storeql.kafka.topics.stock-received=storeql.inventory.stock-received
# Wave picking: a wave completed at a store hands its orders over (WavePickedConsumer)
storeql.kafka.topics.wave-picked=storeql.inventory.wave-picked
storeql.kafka.topics.stock-deducted=storeql.inventory.stock-deducted
storeql.kafka.topics.stock-adjusted=storeql.inventory.stock-adjusted

# PaymentRefunded → accumulate refunded_amount + flip order to (PARTIALLY_)REFUNDED
storeql.kafka.topics.payment-refunded=storeql.payment.payment-refunded

# SJ-D2 repair: tenant-svc re-announces a tenant's declared currency so the tenant_status
# projection can be rebuilt for tenants onboarded before the TenantCreated consumer existed.
storeql.kafka.topics.tenant-currency-declared=storeql.tenant.tenant-currency-declared

# Stranded-order sweeper: cancel PENDING orders never paid within ttl-hours (releases their hold).
storeql.order.pending-sweeper.enabled=true
storeql.order.pending-sweeper.interval-seconds=300
storeql.order.pending-sweeper.ttl-hours=24

# OpenTelemetry
otel.sdk.disabled=false
otel.service.name=order-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317

# 18.5 fiscal regimes. A Portuguese store signs every document with the producer's RSA key, which
# the AT certifies the software against; a German store signs every sale with a security module —
# SIMULATED needs nothing, CLOUD needs the provider's credentials. All secrets: set them in the
# environment, never here.
# storeql.fiscal.pt.private-key=     (PKCS#8 PEM)
# storeql.fiscal.pt.key-version=1
# storeql.fiscal.pt.producer-tax-id=
# storeql.fiscal.tse.cloud.base-url=https://kassensichv-middleware.fiskaly.com/api/v2
# storeql.fiscal.tse.cloud.api-key=
# storeql.fiscal.tse.cloud.api-secret=
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0
