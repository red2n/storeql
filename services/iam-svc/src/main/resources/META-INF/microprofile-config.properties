# iam-svc — defaults (local dev). Secrets come from env / config service in real deployments.
storeql.service.name=iam-svc
server.port=8001
server.host=0.0.0.0

# OpenAPI: generated paths are service-relative (e.g. /auth/login), but the only reachable
# address is through the gateway proxy at /api/iam-svc/.... A relative server URL resolves
# against wherever the spec itself was fetched from (the gateway), so Swagger UI's "Try it
# out" builds the correct request instead of failing with no scheme/host.
mp.openapi.servers=/api/iam-svc

# Database
storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=iam_svc
storeql.db.password=iam_dev_change_me

# Consul
storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

# Kafka (outbox publisher). Set enabled=false to run without Kafka.
storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
storeql.outbox.poll-seconds=5

# Tokens (20.15): RS256 under a rotating key. iam-svc makes its own key pair, keeps the private
# half sealed in its database and publishes the public half at /auth/.well-known/jwks.json, which
# is all the gateway and the MQTT broker verify against. A key signs for rotation-days; on
# rotation the old key stays published for retire-after-seconds (at least the access token
# lifetime) so tokens already out keep verifying, then its private half is wiped.
# storeql.jwt.secret is intentionally NOT set here: it seals the private halves at rest and must
# come from the environment (docker-compose / .env locally, a secret store in production). The
# service refuses to start without one of >= 32 characters.
storeql.jwt.rotation-days=90
# A rotated key is published this long before it signs anything, so verifiers that re-read the
# key set on a schedule (the MQTT broker: every 30 s) have it before a token names it.
storeql.jwt.publish-lead-seconds=60
storeql.jwt.retire-after-seconds=3600
storeql.jwt.issuer=storeql
storeql.jwt.access-ttl-seconds=900
storeql.jwt.refresh-ttl-seconds=1209600

# Second factors (20.12): an authenticator app, passkeys and recovery codes. A login that has one
# is always asked for it; a business requires one of its staff by tier (PUT /auth/admin/mfa-policy)
# and the platform requires one of its administrators unless a deployment says otherwise.
# rp-id and origins are what a passkey is bound to: the domain the app is served from, and the
# exact origins a browser reports for it — set both for anything but localhost.
storeql.mfa.issuer=StoreQL
storeql.mfa.rp-id=localhost
storeql.mfa.origins=http://localhost:8088,http://localhost:40015
storeql.mfa.platform-admin-required=true
storeql.mfa.challenge-ttl-seconds=300
storeql.mfa.max-attempts=5
# Wrong answers over all of one login's sign-ins that lock its second factor for the window: the
# password buys five guesses at a time, and this stops it being bought for ever.
storeql.mfa.lockout-failures=20
storeql.mfa.lockout-window-seconds=900

# Single sign-on through a business's identity provider (20.x, OpenID Connect). callback-url is
# this service's callback as a browser reaches it through the gateway — what a business registers
# with its provider; unset, single sign-on is unavailable. A sign-in returns only to return-origins.
# insecure-hosts names providers reachable over plain HTTP at a private address: a local stand-in
# only, empty in production, where the issuer a business types must be HTTPS on the internet.
# storeql.sso.callback-url=https://api.example.com/api/iam-svc/auth/sso/callback
storeql.sso.return-origins=http://localhost:8088,http://localhost:40015
storeql.sso.flow-ttl-seconds=600
storeql.sso.ticket-ttl-seconds=120
# A session the provider vouched for is renewed for a working day, then the provider is asked again.
storeql.sso.session-max-seconds=43200
storeql.sso.http-timeout-seconds=5

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=iam-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# Forgotten password (intent/password-reset.md). Where the web app is reached from outside: the
# reset link opens there, at /#/reset-password/<token>, needing no sign-in — the token is the
# proof. ttl-minutes is how long a link stays good (30 minutes, once); max-per-hour throttles
# forgot-password requests per address (never per login), whether or not the address is known.
storeql.platform.web-url=http://localhost:8088
storeql.iam.password-reset.ttl-minutes=30
storeql.iam.password-reset.max-per-hour=3
