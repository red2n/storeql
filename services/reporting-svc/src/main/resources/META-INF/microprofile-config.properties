# reporting-svc — defaults (local dev).
storeql.service.name=reporting-svc
server.port=8012
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/reporting-svc/... instead of failing.
mp.openapi.servers=/api/reporting-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=reporting_svc
storeql.db.password=reporting_dev_change_me
storeql.db.schema=reporting

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092

otel.sdk.disabled=false
otel.service.name=reporting-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# Movement statistics read a bounded window (the table grows with every stock event): the days read
# when the caller names no start, and the longest window one report may cover.
storeql.reporting.movement-stats.default-days=90
storeql.reporting.movement-stats.max-days=366

# The system-health screen's waiting work asks purchase-svc, payment-svc and customer-svc for their
# own counts at once; this is how long (ms) the three share before a source is reported unreachable.
storeql.reporting.waiting-work.timeout-millis=2000

# The assembled report is kept per business for a few seconds, so any number of open dashboards of
# one business cause one fan-out (and one set of counts in the owning services) per period. 0 turns
# the cache off. At most this many businesses are kept, the least recently asked for going first
# (0 turns the cache off too).
storeql.reporting.waiting-work.cache-millis=10000
storeql.reporting.waiting-work.cache-max-businesses=10000
