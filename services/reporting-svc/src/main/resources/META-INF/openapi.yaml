openapi: 3.1.0
info:
  title: Reporting Service API
  version: "1.0"
  description: >
    Pure CQRS read-model service built by consuming inventory and sales events (StockReceived,
    StockDeducted, StockAdjusted, TransferOrderShipped/Received, OrderConfirmed, PaymentRefunded,
    OrderVoided). Serves cross-store inventory reports (on-hand, supply/demand netting, movement
    statistics) and sales revenue reports (summary, daily buckets); a till sale voided after the
    fact is left out of every sales report. Publishes no events of its own. Reached through
    the API gateway at /api/reporting-svc.
tags:
  - name: Inventory Reports
    description: Cross-store on-hand, supply/demand netting, and movement-statistics reports.
  - name: Sales Reports
    description: Revenue summary and daily revenue buckets, net of refunds; voided sales left out.
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:storeql:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:storeql:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
