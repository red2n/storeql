payment-svc — defaults (local dev).
storeql.service.name=payment-svc
server.port=8009
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/payment-svc/... instead of failing.
mp.openapi.servers=/api/payment-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=payment_svc
storeql.db.password=payment_dev_change_me
storeql.db.schema=payment

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
storeql.outbox.poll-seconds=5
# Order events that trigger an automatic refund of the captured payment.
storeql.kafka.topics.order-returned=storeql.order.order-returned
storeql.kafka.topics.order-cancelled=storeql.order.order-cancelled
# Substitutions for out-of-stock online lines: the difference goes back as an ORDER_ADJUSTMENT refund.
storeql.kafka.topics.order-line-short-closed=storeql.order.order-line-short-closed
storeql.kafka.topics.order-line-substituted=storeql.order.order-line-substituted
# A gift card charged by order-svc: the GIFT_CARD tender follows.
storeql.kafka.topics.gift-card-redeemed=storeql.order.gift-card-redeemed

# OpenTelemetry
otel.sdk.disabled=false
otel.service.name=payment-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# Which tenders a store accepts is cached per (tenant, store): at most this many stores (least
# recently used out), and an expired answer is served only while tenant-svc cannot be read and is
# dropped once it is this many hours old.
storeql.payment.store-methods-cache.max-entries=10000
storeql.payment.store-methods-cache.max-stale-hours=6
