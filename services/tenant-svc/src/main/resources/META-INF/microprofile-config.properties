# tenant-svc — defaults (local dev).
storeql.service.name=tenant-svc
server.port=8002
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/tenant-svc/... instead of failing.
mp.openapi.servers=/api/tenant-svc

storeql.db.url=jdbc:postgresql://localhost:5432/storeql
storeql.db.user=tenant_svc
storeql.db.password=tenant_dev_change_me

storeql.consul.enabled=true
storeql.consul.host=localhost
storeql.consul.port=8500

# Kafka (outbox publisher)
storeql.kafka.enabled=true
storeql.kafka.bootstrap=localhost:9092
storeql.outbox.poll-seconds=5

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=tenant-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# Where the web app is reached from outside. The pay link in a dunning notice (21.12) opens there,
# by a business that cannot sign in; the docker stack sets it to the host's port.
storeql.platform.web-url=http://localhost:8088

# How many days before a trial ends the business is told it is ending (21.13); the day it ends it
# is told again, with the first invoice and the link that pays it.
storeql.billing.trial-notice-days=3
