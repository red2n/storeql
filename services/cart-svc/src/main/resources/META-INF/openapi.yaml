openapi: 3.1.0
info:
  title: Cart Service API
  version: "1.0"
  description: >
    Server-side shopping cart for the online storefront channel: session-scoped guest carts and
    authenticated customer carts, with merge-on-login. Every call requires a verified token. Reacts
    to OrderPlaced (closes the cart) and TenantStatusChanged/StoreStatusChanged (flow-guard: rejects
    cart mutations early if the business is switched off or the store is suspended or closed).
    Reached through the API gateway at /api/cart-svc.
tags:
  - name: Cart
    description: Cart creation/lookup, item add/update/remove, and guest-to-customer cart merge.
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:storeql:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:storeql:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
