server.port=8009
# 07.13: a supplier's Factur-X PDF may be 20 MB (shared/einvoice FacturX.MAX_PDF_BYTES).
server.max-payload-size=21000000
mp.application.name=purchase-svc

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/purchase-svc/... instead of failing.
mp.openapi.servers=/api/purchase-svc
storeql.db.schema=purchase
storeql.db.user=purchase_svc
storeql.db.password=purchase_dev_change_me
storeql.consul.enabled=true
storeql.kafka.enabled=true

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=purchase-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0

# Accounting connectors (17.9). Journals the ledger posts are pushed to the business's package —
# Xero, QuickBooks Online, Sage Business Cloud Accounting, or the platform's SIMULATED stand-in — by
# the clock: every poll-seconds, up to batch journals a pass, each tried up to five times with a
# growing wait. The tokens a package issued are sealed under secrets-key (16, 24 or 32 bytes,
# base64: openssl rand -base64 32); with no key, connecting a real package is refused and the
# stand-in still works. Never a default in this file: the key is the deployment's.
storeql.accounting.enabled=true
storeql.accounting.poll-seconds=30
storeql.accounting.batch=50
