<!DOCTYPE html>
<!-- lang: WCAG 2.1 success criterion 3.1.1; en-GB is the app's fallback locale. -->
<html lang="en-GB">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="storeql.com — multi-tenant retail platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Browser chrome / status bar follows the app's light and dark themes (lib/core/theme.dart). -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <!-- Favicon placeholder -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <title>storeql.com</title>
  <style>
    /* Splash matches the first Flutter frame in both themes — no white flash in dark mode. */
    :root { --sq-bg: #FAF8F3; --sq-muted: #5F5C55; --sq-accent: #3A3833; }
    @media (prefers-color-scheme: dark) {
      :root { --sq-bg: #161513; --sq-muted: #BDB8AD; --sq-accent: #F2D27A; }
    }
    body {
      margin: 0;
      background-color: var(--sq-bg);
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--sq-muted);
      font-size: 1.1rem;
      gap: 12px;
    }
    #loading .spinner {
      width: 32px;
      height: 32px;
      animation: spinner-rotate 1.4s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation: none; }
    }
    #loading .spinner circle {
      fill: none;
      stroke: var(--sq-accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 80;
      stroke-dashoffset: 60;
      transform-origin: center;
    }
    @keyframes spinner-rotate {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <svg class="spinner" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="10" />
    </svg>
    Loading Store…
  </div>
  <noscript>This shop needs JavaScript to run.</noscript>
  <script src="first_frame.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
