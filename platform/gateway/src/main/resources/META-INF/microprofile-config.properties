# gateway — defaults
storeql.service.name=gateway
server.port=8080
server.host=0.0.0.0

# Consul, for resolving upstream services
storeql.consul.host=localhost
storeql.consul.port=8500

# Redis — backs rate-limit and brute-force counters, shared across every gateway replica.
# storeql.redis.password is intentionally left at the docker-compose dev default here; override
# via environment in any deployment that changes REDIS_PASSWORD.
storeql.redis.host=localhost
storeql.redis.port=6379
storeql.redis.password=redis_dev_change_me
# Commands that may wait on the Redis connection at once; while Redis is down commands are refused
# at once (requests go through unmetered), and past this many in flight they are refused too.
storeql.gateway.redis.request-queue-size=10000

# Inbound request size cap. Helidon 4 buffers the full body before forwarding;
# without this any client can exhaust gateway heap with a large upload. The server cap is the
# largest upload route's (a supplier's e-invoice PDF, 07.13); BodySizeFilter holds every other
# route to max-body-bytes, refusing on the declared length before reading.
server.max-payload-size=21000000
storeql.gateway.max-body-bytes=1048576
# The card-number guard scans at most this many bytes of a text body (binary uploads are not scanned).
storeql.gateway.card-data-guard.max-scan-bytes=1048576
# The routes that take a document, each with its own cap, are GatewayConfig's default and are not
# repeated here: this file's copy had gone stale and shadowed it (SJ-D64). Override per environment
# with STOREQL_GATEWAY_UPLOAD_ROUTES only to change a cap, and then list every route.

# Gateway protection defaults
storeql.gateway.rate-limit.enabled=true
storeql.gateway.rate-limit.requests-per-minute=100
storeql.gateway.brute-force.enabled=true
storeql.gateway.brute-force.max-failures=5
storeql.gateway.brute-force.block-minutes=15
storeql.gateway.brute-force.login-path=/auth/login

# CORS — comma-separated browser origins allowed to call the API. Unset (default) means
# no CORS headers are emitted, so browser frontends are denied until configured. NOTE: do not
# set this to an empty value — MP Config treats empty as "absent", which is fine, but the key
# is left unset here on purpose.
# e.g. storeql.gateway.cors.allowed-origins=https://shop.example.com,https://admin.example.com

# API versioning (22.8). Every route is /api/v1/{service}/...; the unversioned /api/{service}/...
# alias is deprecated and answers with Deprecation (RFC 9745), Sunset (RFC 8594) and a Link to the
# successor until the sunset day, then 410. A version not listed is 404. GET /api/versions
# describes all of it, no credential needed. Change these only with a new version or a new date;
# an inconsistent set (a current version not listed, a sunset before the deprecation) stops the
# gateway at start.
storeql.gateway.api.current=v1
storeql.gateway.api.versions=v1
storeql.gateway.api.alias-deprecated-since=2026-09-23
storeql.gateway.api.alias-sunset=2027-09-30

# JWT validation (20.15): tokens are RS256, verified against the public keys iam-svc publishes at
# /auth/.well-known/jwks.json. The gateway holds no signing secret: it can check a token, it
# cannot make one. The set is re-read when a token names a key not seen yet (a rotation) and
# every refresh-seconds; storeql.clients.iam-svc.url overrides discovery in tests.
storeql.gateway.jwks.refresh-seconds=300
# How long a caller waits for the first key-set read already in flight (only before any set has ever
# been read; after that nobody waits, the last good set is used while one caller refreshes).
storeql.gateway.jwks.first-load-wait-ms=3000
# The gateway's own lookups on the request path (key set, tenant status, plan allowances, API-key
# check) use short timeouts so a slow iam-svc or tenant-svc costs a request seconds, never minutes.
storeql.gateway.control-plane.connect-timeout-ms=1000
storeql.gateway.control-plane.read-timeout-ms=2000
storeql.jwt.issuer=storeql

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=gateway
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0
