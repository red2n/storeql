# The 12 business services. Each: own Postgres role/schema, registers with Consul under
# STOREQL_ADVERTISE_HOST (must equal this file's k8s Service name — the gateway and any
# peer service resolve each other via Consul's stored Address, not k8s DNS directly).
#
# Probes use the full 3-endpoint model (ARCHITECTURE.md DoD): /health/started gates how
# long the JVM + inline Flyway migration get to boot before being killed; /health/ready
# gates traffic (checks real DB/Kafka/config reachability); /health/live triggers a
# restart. docker-compose.yml's single Docker healthcheck only used /health/live for all
# three purposes — Kubernetes lets us use the granular endpoints each service already
# exposes.
#
# Flyway migrations run inline at boot (FlywayRunner, shared/common-service) — there is
# no standalone "migrate-only" entry point in this codebase today, so this mirrors
# exactly how docker-compose.yml and the storeql.com VPS deployment already run in
# production. Safe at replicas: 1 (no concurrent-migration race); re-check before ever
# scaling any of these to >1 replica.

---
apiVersion: v1
kind: Service
metadata: { name: iam-svc, namespace: storeql }
spec:
  selector: { app: iam-svc }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: iam-svc, namespace: storeql }
spec:
  replicas: 1
  selector: { matchLabels: { app: iam-svc } }
  template:
    metadata: { labels: { app: iam-svc } }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: iam-svc
          image: ghcr.io/red2n/storeql-iam-svc:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: storeql-common-env }
            - secretRef: { name: storeql-config-token }
            # key "storeql.jwt.secret" seals the token signing keys' private halves at rest (20.15);
            # tokens themselves are RS256 under a rotating key. Only iam-svc is given it.
            - secretRef: { name: storeql-jwt }
          env:
            - { name: STOREQL_DB_USER, value: "iam_svc" }
            - name: STOREQL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: storeql-postgres, key: IAM_DB_PASSWORD } }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms128m -Xmx512m -XX:+UseG1GC" }
            - { name: STOREQL_ADVERTISE_HOST, value: "iam-svc" }
            # Single sign-on (20.x): set both to this deployment's own hosts to offer it. The
            # callback is iam-svc's as a browser reaches it through the gateway, and is what a
            # business registers with its identity provider; unset, single sign-on is unavailable.
            # storeql.sso.insecure-hosts stays unset here: a provider is HTTPS on the internet.
            # - { name: STOREQL_SSO_CALLBACK_URL, value: "https://api.<your-domain>/api/iam-svc/auth/sso/callback" }
            # - { name: STOREQL_SSO_RETURN_ORIGINS, value: "https://app.<your-domain>" }
            # The link in a password-reset email opens the web app: set it to the app's own host.
            # - { name: STOREQL_PLATFORM_WEB_URL, value: "https://app.<your-domain>" }
          startupProbe:
            httpGet: { path: /health/started, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 450Mi }
            limits: { cpu: 500m, memory: 700Mi }

