    metadata: { labels: { app: notification-svc } }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: notification-svc
          image: ghcr.io/red2n/storeql-notification-svc:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: storeql-common-env }
            - secretRef: { name: storeql-config-token }
          env:
            - { name: STOREQL_DB_USER, value: "notification_svc" }
            - name: STOREQL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: storeql-postgres, key: NOTIFICATION_DB_PASSWORD } }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms128m -Xmx384m -XX:+UseG1GC" }
            - { name: STOREQL_ADVERTISE_HOST, value: "notification-svc" }
            # Email: a password reset goes by email only, so a deployment with no mail service
            # cannot deliver one (it is logged NOT_SENT). Set the channel to email and point SMTP at
            # your provider; keep its username and password in a Secret.
            # - { name: STOREQL_NOTIFICATION_CHANNEL, value: "email" }
            # - { name: STOREQL_NOTIFICATION_SMTP_HOST, value: "smtp.<your-provider>" }
            # - { name: STOREQL_NOTIFICATION_SMTP_PORT, value: "587" }
            # - { name: STOREQL_NOTIFICATION_FROM, value: "no-reply@<your-domain>" }
            # - name: STOREQL_NOTIFICATION_SMTP_USERNAME
            #   valueFrom: { secretKeyRef: { name: storeql-smtp, key: username } }
            # - name: STOREQL_NOTIFICATION_SMTP_PASSWORD
            #   valueFrom: { secretKeyRef: { name: storeql-smtp, key: password } }
          startupProbe:
            httpGet: { path: /health/started, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 150m, memory: 320Mi }
            limits: { cpu: 400m, memory: 512Mi }

---
