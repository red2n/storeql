# Non-secret configuration shared across the stack. Mirrors docker-compose.yml's
# x-svc-env anchor + infra/prometheus/prometheus.yml + infra/grafana/provisioning.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storeql-common-env
  namespace: storeql
data:
  # SERVER_PORT maps to the "server.port" MP Config property per the spec's standard
  # env-var mapping rules (dots/hyphens -> underscore, uppercased) — same for every
  # STOREQL_* key below (e.g. STOREQL_DB_URL -> storeql.db.url). No literal-dotted env var
  # names needed; Helidon resolves them the same way docker-compose.yml's dotted keys do.
  SERVER_PORT: "8080"
  # Runtime app pool goes through PgBouncer; Flyway migrates straight to Postgres
  # (its DDL runs as multi-statement transactions that need full session affinity,
  # which PgBouncer's transaction pool_mode breaks — see infra/postgres note in
  # docker-compose.yml x-svc-env).
  STOREQL_DB_URL: "jdbc:postgresql://pgbouncer:6432/storeql?prepareThreshold=0"
  STOREQL_DB_MIGRATION_URL: "jdbc:postgresql://postgres:5432/storeql"
  STOREQL_CONSUL_HOST: "consul"
  STOREQL_CONSUL_PORT: "8500"
  STOREQL_KAFKA_BOOTSTRAP: "kafka:29092"
  STOREQL_CONFIG_URL: "http://config:8080"
  # No config-repo/*.properties files are shipped for any profile (server-side
  # stub only) — every service falls back to its own baked-in defaults regardless
  # of this value. Kept as "docker" to match the exact behavior already exercised
  # in docker-compose.yml; there is nothing to gain by inventing a "k8s" profile
  # with no backing config files.
  STOREQL_CONFIG_PROFILE: "docker"
  STOREQL_REDIS_HOST: "redis"
  STOREQL_REDIS_PORT: "6379"

---
# All Helidon MP services expose /metrics in Prometheus format — same scrape config as
# infra/prometheus/prometheus.yml, extended to cover all 12 business services + gateway +
# config (the checked-in compose file's copy is missing cart/payment/customer/notification/
# reporting-svc jobs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: storeql-prometheus-config
  namespace: storeql
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        project: 'storeql'
        env: 'k3s'

    rule_files:
      - /etc/prometheus/rules/*.yml

    # Firing alerts go to Alertmanager, which decides who is told (storeql-alertmanager-config).
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: 'alertmanager'
        metrics_path: /metrics
        static_configs:
          - targets: ['alertmanager:9093']
            labels: { service: 'alertmanager', layer: 'infra' }

      - job_name: 'prometheus'
        metrics_path: /metrics
        static_configs:
          - targets: ['localhost:9090']
            labels: { service: 'prometheus', layer: 'infra' }

      - job_name: 'gateway'
        metrics_path: /metrics
        static_configs:
          - targets: ['gateway:8080']
            labels: { service: 'gateway', layer: 'platform' }

      - job_name: 'config'
        metrics_path: /metrics
        static_configs:
          - targets: ['config:8080']
            labels: { service: 'config', layer: 'platform' }

      - job_name: 'iam-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['iam-svc:8080']
            labels: { service: 'iam-svc', layer: 'business' }

      - job_name: 'tenant-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['tenant-svc:8080']
            labels: { service: 'tenant-svc', layer: 'business' }

      - job_name: 'inventory-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['inventory-svc:8080']
            labels: { service: 'inventory-svc', layer: 'business' }

      - job_name: 'product-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['product-svc:8080']
            labels: { service: 'product-svc', layer: 'business' }

      - job_name: 'pricing-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['pricing-svc:8080']
            labels: { service: 'pricing-svc', layer: 'business' }

      - job_name: 'purchase-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['purchase-svc:8080']
            labels: { service: 'purchase-svc', layer: 'business' }

      - job_name: 'order-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['order-svc:8080']
            labels: { service: 'order-svc', layer: 'business' }

      - job_name: 'cart-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['cart-svc:8080']
            labels: { service: 'cart-svc', layer: 'business' }

      - job_name: 'payment-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['payment-svc:8080']
            labels: { service: 'payment-svc', layer: 'business' }

      - job_name: 'customer-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['customer-svc:8080']
            labels: { service: 'customer-svc', layer: 'business' }

      - job_name: 'notification-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['notification-svc:8080']
            labels: { service: 'notification-svc', layer: 'business' }

      - job_name: 'reporting-svc'
        metrics_path: /metrics
        static_configs:
          - targets: ['reporting-svc:8080']
            labels: { service: 'reporting-svc', layer: 'business' }

      # ── Infrastructure exporters ─────────────────────────────────────────────
      - job_name: 'node'
        static_configs:
          - targets: ['node-exporter.storeql-nodes:9100']
            labels: { service: 'node', layer: 'infra' }

      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
            labels: { service: 'postgres', layer: 'infra' }

      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
            labels: { service: 'redis', layer: 'infra' }

      - job_name: 'consul'
        metrics_path: /v1/agent/metrics
        params:
          format: ['prometheus']
        static_configs:
          - targets: ['consul:8500']
            labels: { service: 'consul', layer: 'infra' }

---
# The alert rules Prometheus evaluates. A copy of infra/prometheus/rules/alerts.yml (the compose
# stack mounts the whole rules directory); scripts/k8s-hardening-check.py fails CI if the two differ.
# infra/prometheus/rules/backups.yml is deliberately NOT here: nothing on Kubernetes produces the
# storeql_backup_* metrics it reads, so loading it would raise a permanent false alert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storeql-prometheus-rules
  namespace: storeql
data:
  alerts.yml: |
    groups:

      # ── Service availability ─────────────────────────────────────────────────────
      - name: service-availability
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is DOWN"
              description: "{{ $labels.job }} ({{ $labels.instance }}) has been unreachable for more than 1 minute."

          - alert: ServiceRestartDetected
            expr: resets(jvm_uptime_seconds[5m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.job }} restarted"
              description: "JVM uptime on {{ $labels.job }} reset — possible crash or redeploy."

      # ── JVM memory ──────────────────────────────────────────────────────────────
      - name: jvm-memory
        rules:
          - alert: HeapUsageHigh
            expr: memory_usedHeap_bytes / memory_maxHeap_bytes > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High heap on {{ $labels.job }}: {{ $value | humanizePercentage }}"
              description: "Heap on {{ $labels.job }} has been above 85% for 5 minutes. Risk of OOM."

          - alert: HeapUsageCritical
            expr: memory_usedHeap_bytes / memory_maxHeap_bytes > 0.95
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "CRITICAL heap on {{ $labels.job }}: {{ $value | humanizePercentage }}"
              description: "Heap on {{ $labels.job }} is above 95%. OOM imminent."

      # ── JVM threads ─────────────────────────────────────────────────────────────
      - name: jvm-threads
        rules:
          - alert: ThreadCountHigh
            expr: thread_count > 300
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High thread count on {{ $labels.job }}: {{ $value }}"
              description: "Thread count on {{ $labels.job }} exceeded 300 for 5 minutes."

      # ── PostgreSQL ───────────────────────────────────────────────────────────────
      - name: postgres
        rules:
          - alert: PostgresDown
            expr: pg_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL is DOWN"
              description: "postgres_exporter cannot reach PostgreSQL."

          - alert: PostgresConnectionsHigh
            expr: sum(pg_stat_activity_count) > 200
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL connections high: {{ $value }}"
              description: "More than 200 active connections to PostgreSQL for 5 minutes."

          - alert: PostgresSlowQueriesDetected
            expr: max(pg_stat_activity_max_tx_duration{state="active"}) > 30
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "A PostgreSQL transaction has been active for {{ $value }}s"

      # ── Redis ────────────────────────────────────────────────────────────────────
      - name: redis
        rules:
          - alert: RedisDown
            expr: redis_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Redis is DOWN"

          - alert: RedisMemoryHigh
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Redis memory high: {{ $value | humanizePercentage }}"
              description: "Redis memory usage exceeded 85% of the 256 MB limit."

      # ── Node / host ──────────────────────────────────────────────────────────────
      - name: node
        rules:
          - alert: HostHighCpuLoad
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Host CPU load high: {{ $value | humanize }}%"

          - alert: HostLowDiskSpace
            expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Low disk space: {{ $value | humanize }}% free on /"

          - alert: HostMemoryPressure
            expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Host memory low: {{ $value | humanizePercentage }} available"

      # ── Script integrity on the web shell (PCI DSS 11.6.1) ──────────────────────
      - name: script-integrity
        rules:
          - alert: ScriptIntegrityDrift
            expr: storeql_script_integrity_drift > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "A script on the web shell changed or appeared"
              description: "The gateway's script integrity monitor found {{ $value }} difference(s) between the scripts the web shell serves and its inventory. See GET /admin/security/script-integrity on the gateway."

          - alert: ScriptIntegrityUnchecked
            expr: storeql_script_integrity_drift < 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "The web shell could not be checked for script integrity"
              description: "The gateway could not read the web shell's entry page or inventory for 30 minutes, so its scripts are unverified."

      # ── WAL archiving ───────────────────────────────────────────────────────────
      # Postgres's own archiver counters come from postgres_exporter, which runs in compose and on
      # Kubernetes alike. A WAL archive that is failing is a restore to a moment that will not work.
      - name: wal-archive
        rules:
          - alert: WalArchiveFailing
            expr: increase(pg_stat_archiver_failed_count[15m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL cannot archive its WAL"
              description: "archive_command is failing: the WAL piles up under pg_wal and no restore to a moment is possible past the last archived segment. Check the backups volume and its permissions."

      # ── The alert path itself ───────────────────────────────────────────────────
      # An Alertmanager that cannot send (a wrong SMTP host, an expired token, an unreachable webhook)
      # looks healthy and tells nobody, and so does a Prometheus that cannot reach it. Both are critical
      # so the alert also takes the webhook route, which does not depend on the mail that may be failing.
      # They show in Prometheus's own alert page even when nothing is delivered.
      - name: alerting
        rules:
          - alert: AlertNotificationsFailing
            # A failed send that Alertmanager then retried successfully raises the rate for one window and
            # is gone before 10 minutes; a route that keeps failing keeps the rate up and fires.
            expr: sum by (integration) (rate(alertmanager_notifications_failed_total[5m])) > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Alertmanager cannot deliver {{ $labels.integration }} notifications"
              description: "Sending through {{ $labels.integration }} has kept failing for 10 minutes, so alerts are not reaching anyone by that route. Check the receiver in alertmanager.yml (host, credentials, reachability); Alertmanager's log says why."

          - alert: PrometheusCannotReachAlertmanager
            expr: rate(prometheus_notifications_errors_total[5m]) > 0 or max(prometheus_notifications_alertmanagers_discovered) < 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus cannot deliver alerts to Alertmanager"
              description: "Prometheus has errors sending to Alertmanager or has none configured, so nothing that fires is routed to anyone. Check that Alertmanager is up and that prometheus.yml's alerting section names it."
---
# Who is told when an alert fires. Out of the box NOBODY is: the default receiver has no
# integration, so a firing alert shows in Prometheus's alert page and in Alertmanager's (kubectl -n
# storeql port-forward svc/alertmanager 9093) and nobody is sent anything. Add your receivers here
# (mail, Slack, PagerDuty, a webhook) and keep their passwords and tokens out of this file: put each in
# the Secret storeql-alertmanager-secrets (mounted at /etc/alertmanager/secrets) and name it with
# smtp_auth_password_file or authorization.credentials_file. The pod can reach the internet on 443,
# 465 and 587 (05-network-policies.yaml). A change here reaches the pod only after
# kubectl -n storeql rollout restart deployment/alertmanager. k8s/README.md, "Alerting".
apiVersion: v1
kind: ConfigMap
metadata:
  name: storeql-alertmanager-config
  namespace: storeql
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: unconfigured
      group_by: ['alertname', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          receiver: unconfigured
          repeat_interval: 1h
    receivers:
      - name: unconfigured
    inhibit_rules:
      - source_matchers: ['alertname=~"ServiceDown|PostgresDown|RedisDown"']
        target_matchers: ['severity="warning"']
        equal: ['job', 'instance']
---
# Grafana datasources — Prometheus only. Loki/Tempo/Zipkin are intentionally not
# deployed in this k3s cut (see k8s/README.md); add their datasources back here if/when
# the tracing/log-aggregation stack is added.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storeql-grafana-datasources
  namespace: storeql
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus-storeql
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"
          httpMethod: POST
          prometheusType: Prometheus

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storeql-grafana-dashboard-provider
  namespace: storeql
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: storeql
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
# On a fresh Postgres volume: the pg_hba line the backup job's base backups need (16-backup.yaml).
# Mirrors infra/postgres-init-hba.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storeql-postgres-init-hba
  namespace: storeql
data:
  02-replication-hba.sh: |
    #!/bin/sh
    set -e
    HBA="${PGDATA:-/var/lib/postgresql/data}/pg_hba.conf"
    grep -q storeql-backup "$HBA" || printf 'host replication all all scram-sha-256 # storeql-backup: base backups for point-in-time recovery\n' >> "$HBA"
