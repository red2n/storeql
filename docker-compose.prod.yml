# Production overlay for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this adds / changes vs. the base dev file:
#   - Caddy as the edge TLS terminator (auto Let's Encrypt, ports 80 + 443)
#   - Gateway CORS locked to https://app.storeql.com  (dev file uses "*")
#   - trust-forwarded-headers=true so rate-limiter keys on the real client IP
#   - Rate-limit restored to 100 req/min  (dev file sets 30,000 for k6 runs)
#   - Datastore secrets are made REQUIRED (fail-fast). The base dev file defaults
#     every datastore password to a public "*_dev_change_me" constant so the stack
#     runs out of the box; in production those defaults must never apply. The
#     overrides below re-reference each secret with ${VAR:?...} so `docker compose`
#     refuses to start if it is unset — the same guard the JWT secret already uses.
#     Forcing each variable to be set makes every ${VAR:-dev_default} consumer
#     elsewhere in the base file resolve to the real value too.
#
# Firewall: allow ports 80 and 443 inbound only.
# All other host ports (8090 gateway, 8088 storeql-app, 8081 Kafka UI, etc.) are
# bound to 127.0.0.1 in docker-compose.yml so they are unreachable on the public
# IP by design — no separate firewall rule is needed for them. SSH-tunnel access
# still works because the tunnel connects via the loopback interface (see §11 of
# docs/vps-deployment.md). NOTE: loopback binding limits exposure but is not a
# substitute for strong secrets — any SSRF or in-network foothold reaches these
# ports, so the passwords below must still be unguessable.
#
# Required env vars (add to .env):
#   CADDY_ACME_EMAIL  — Let's Encrypt renewal notices (e.g. ops@storeql.com)
#   POSTGRES_PASSWORD — Postgres superuser password (strong, unique)
#   REDIS_PASSWORD    — Redis AUTH password (strong, unique)
#   GRAFANA_PASSWORD  — Grafana admin password (strong, unique)
#   ALERTMANAGER_CONFIG_FILE — your Alertmanager config with real receivers (mail, on-call webhook)
#   PGADMIN_PASSWORD  — pgAdmin login password (strong, unique)
#   <SVC>_DB_PASSWORD — one per service (IAM_DB_PASSWORD, TENANT_DB_PASSWORD,
#                       INVENTORY_DB_PASSWORD, ORDER_DB_PASSWORD, PURCHASE_DB_PASSWORD,
#                       CART_DB_PASSWORD, PRICING_DB_PASSWORD, PAYMENT_DB_PASSWORD,
#                       PRODUCT_DB_PASSWORD, CUSTOMER_DB_PASSWORD, NOTIFICATION_DB_PASSWORD,
#                       REPORTING_DB_PASSWORD). Each must also be applied to its Postgres
#                       role via `ALTER ROLE <svc> PASSWORD ...` (see postgres-init-roles.sql).
#
# Required GitHub Actions variable (Settings → Variables → Actions):
#   STOREQL_API_BASE = https://api.storeql.com/api
#   (baked into the Flutter web bundle at CI build time)

services:

  # ── Edge proxy: TLS termination + subdomain routing ──────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: storeql-caddy
    restart: unless-stopped
    ports:
      - "80:80"        # HTTP → HTTPS redirect + ACME HTTP-01 challenge
      - "443:443"      # HTTPS (TLS 1.2 / 1.3)
      - "443:443/udp"  # HTTP/3 (QUIC)
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL in .env (e.g. ops@storeql.com)}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # Let's Encrypt certs — persisted across restarts/upgrades
      - caddy_config:/config  # Caddy internal state
    networks: [storeql_network]
    depends_on:
      gateway:   { condition: service_healthy }
      storeql-app: { condition: service_healthy }

  # ── Gateway: production environment overrides ─────────────────────────────────
  gateway:
    environment:
      # CORS: only the real web app domain may call the API (dev file uses "*")
      storeql.gateway.cors.allowed-origins: "https://app.storeql.com"
      # Trust X-Forwarded-For injected by Caddy so the gateway's rate-limiter and
      # brute-force protection (login throttle) key on the real client IP
      storeql.gateway.trust-forwarded-headers: "true"
      # Restore the production rate-limit budget (dev file bumps to 30,000 to
      # avoid 429s while the k6 multi-tenant load test drives ~50 VUs from one IP)
      storeql.gateway.rate-limit.requests-per-minute: "100"

  # ── Datastore secrets: required in production (fail-fast) ─────────────────────
  # Each override re-references the secret with ${VAR:?...}. If the var is unset,
  # `docker compose ... up` aborts at config-load time instead of silently booting
  # with the repo's public dev default. Because the variable is then guaranteed to
  # be set, the base file's ${VAR:-*_dev_change_me} references (business-service DB
  # passwords, the postgres-exporter DSN, the redis healthcheck, gateway redis auth)
  # all resolve to this same real value.
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env — no dev default in production}

  redis:
    # command is list/scalar-typed, so this replaces the base command wholesale
    # (keeping the same memory caps) with the fail-fast password reference.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env — no dev default in production}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set a strong GRAFANA_PASSWORD in .env — no dev default in production}

  pgadmin:
    environment:
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set a strong PGADMIN_PASSWORD in .env — no dev default in production}

  # The base file's Alertmanager mails Mailpit and posts to the webhook sink, neither of which exists in
  # production, so an alert would reach nobody. Compose cannot require a mounted file, so the variable
  # is made required through the container's environment: the stack refuses to start until
  # ALERTMANAGER_CONFIG_FILE names a config with your own receivers (docs/vps-deployment.md).
  alertmanager:
    environment:
      STOREQL_ALERTMANAGER_CONFIG_FILE: ${ALERTMANAGER_CONFIG_FILE:?Set ALERTMANAGER_CONFIG_FILE in .env to a copy of infra/alertmanager/alertmanager.yml with your own receivers — the default mails a test inbox that does not exist in production}

  # ── Per-service Postgres role passwords: required in production ───────────────
  # infra/postgres-init-roles.sql creates one LOGIN role per service (golden rule
  # #1 hardening) with a dev password baked into the SQL. In production each role's
  # password MUST be rotated (`ALTER ROLE <svc> PASSWORD '<generated>'`, see the
  # script header) AND supplied to the service via <SVC>_DB_PASSWORD. The base file
  # defaults each to "<svc>_dev_change_me"; without the guards below a service would
  # silently connect with that public password. Forcing the var fails fast if unset
  # — and if it's set but the role wasn't rotated to match, the service fails to
  # connect (loud, fail-closed) instead of running on a known credential.
  iam-svc:
    environment:
      storeql.db.password: ${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in .env and ALTER ROLE iam to match}
  tenant-svc:
    environment:
      storeql.db.password: ${TENANT_DB_PASSWORD:?Set TENANT_DB_PASSWORD in .env and ALTER ROLE tenant to match}
  inventory-svc:
    environment:
      storeql.db.password: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in .env and ALTER ROLE inventory to match}
  order-svc:
    environment:
      storeql.db.password: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env and ALTER ROLE order to match}
  purchase-svc:
    environment:
      storeql.db.password: ${PURCHASE_DB_PASSWORD:?Set PURCHASE_DB_PASSWORD in .env and ALTER ROLE purchase to match}
  cart-svc:
    environment:
      storeql.db.password: ${CART_DB_PASSWORD:?Set CART_DB_PASSWORD in .env and ALTER ROLE cart to match}
  pricing-svc:
    environment:
      storeql.db.password: ${PRICING_DB_PASSWORD:?Set PRICING_DB_PASSWORD in .env and ALTER ROLE pricing to match}
  payment-svc:
    environment:
      storeql.db.password: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env and ALTER ROLE payment to match}
  product-svc:
    environment:
      storeql.db.password: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in .env and ALTER ROLE product to match}
  customer-svc:
    environment:
      storeql.db.password: ${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD in .env and ALTER ROLE customer to match}
  notification-svc:
    environment:
      storeql.db.password: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env and ALTER ROLE notification to match}
  reporting-svc:
    environment:
      storeql.db.password: ${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD in .env and ALTER ROLE reporting to match}

volumes:
  caddy_data:
    name: storeql_caddy_data
  caddy_config:
    name: storeql_caddy_config
