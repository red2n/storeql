groups:

  # ── Service availability ─────────────────────────────────────────────────────
  - name: service-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been unreachable for more than 1 minute."

      - alert: ServiceRestartDetected
        expr: changes(jvm_uptime_seconds[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} restarted"
          description: "JVM uptime on {{ $labels.job }} reset — possible crash or redeploy."

  # ── JVM memory ──────────────────────────────────────────────────────────────
  - name: jvm-memory
    rules:
      - alert: HeapUsageHigh
        expr: memory_usedHeap_bytes / memory_maxHeap_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High heap on {{ $labels.job }}: {{ $value | humanizePercentage }}"
          description: "Heap on {{ $labels.job }} has been above 85% for 5 minutes. Risk of OOM."

      - alert: HeapUsageCritical
        expr: memory_usedHeap_bytes / memory_maxHeap_bytes > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL heap on {{ $labels.job }}: {{ $value | humanizePercentage }}"
          description: "Heap on {{ $labels.job }} is above 95%. OOM imminent."

  # ── JVM threads ─────────────────────────────────────────────────────────────
  - name: jvm-threads
    rules:
      - alert: ThreadCountHigh
        expr: thread_count > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High thread count on {{ $labels.job }}: {{ $value }}"
          description: "Thread count on {{ $labels.job }} exceeded 300 for 5 minutes."

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "postgres_exporter cannot reach PostgreSQL."

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections high: {{ $value }}"
          description: "More than 200 active connections to PostgreSQL for 5 minutes."

      - alert: PostgresSlowQueriesDetected
        expr: rate(pg_stat_activity_max_tx_duration{state="active"}[1m]) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow queries on PostgreSQL ({{ $value }}s max active tx)"

  # ── Redis ────────────────────────────────────────────────────────────────────
  - name: redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory high: {{ $value | humanizePercentage }}"
          description: "Redis memory usage exceeded 85% of the 256 MB limit."

  # ── Node / host ──────────────────────────────────────────────────────────────
  - name: node
    rules:
      - alert: HostHighCpuLoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU load high: {{ $value | humanize }}%"

      - alert: HostLowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space: {{ $value | humanize }}% free on /"

      - alert: HostMemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory low: {{ $value | humanizePercentage }} available"

  # ── Script integrity on the web shell (PCI DSS 11.6.1) ──────────────────────
  - name: script-integrity
    rules:
      - alert: ScriptIntegrityDrift
        expr: storeql_script_integrity_drift > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A script on the web shell changed or appeared"
          description: "The gateway's script integrity monitor found {{ $value }} difference(s) between the scripts the web shell serves and its inventory. See GET /admin/security/script-integrity on the gateway."

      - alert: ScriptIntegrityUnchecked
        expr: storeql_script_integrity_drift < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The web shell could not be checked for script integrity"
          description: "The gateway could not read the web shell's entry page or inventory for 30 minutes, so its scripts are unverified."

  # ── Backups ─────────────────────────────────────────────────────────────────
  # The backup job writes its metrics for the node exporter's textfile collector; Postgres's own
  # archiver counters come from postgres_exporter. A backup nobody has taken lately, or a WAL
  # archive that is failing, is a restore that will not work when it is needed.
  - name: backups
    rules:
      - alert: BackupMissing
        expr: absent(storeql_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No backup has ever reported"
          description: "The backup job's metrics are not being scraped: is the backup service running, and node-exporter reading /backups/metrics?"

      - alert: BackupStale
        expr: time() - storeql_backup_last_success_timestamp_seconds > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "The last successful backup is more than 26 hours old"
          description: "A daily backup did not land. Check the backup service's log (docker compose logs backup) and take one by hand: docker compose run --rm backup now."

      - alert: BackupUnencrypted
        expr: storeql_backup_encrypted == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Backups are being written unencrypted"
          description: "STOREQL_BACKUP_RECIPIENT is not set; every dump on the backups volume is readable as it is."

      - alert: BaseBackupStale
        expr: time() - storeql_backup_base_last_timestamp_seconds > 9 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No base backup for point-in-time recovery in nine days"
          description: "A restore to a moment replays every archived WAL segment since the last base backup; the longer since, the longer that takes. docker compose run --rm backup base."

      - alert: WalArchiveFailing
        expr: increase(pg_stat_archiver_failed_count[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL cannot archive its WAL"
          description: "archive_command is failing: the WAL piles up under pg_wal and no restore to a moment is possible past the last archived segment. Check the backups volume and its permissions."
